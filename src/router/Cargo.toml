[package]
name = "tuwunel_router"
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
bench = false
crate-type = [
	"rlib",
#	"dylib",
]

[features]
default = [
	"brotli_compression",
	"direct_tls",
	"gzip_compression",
	"mas",
	"oidc",
	"release_max_log_level",
	"sentry_telemetry",
	"synapse_admin",
	"systemd",
	"zstd_compression",
	"tuwunel-admin/default",
	"tuwunel-api/default",
	"tuwunel-api-admin?/default",
	"tuwunel-api-client/default",
	"tuwunel-api-federation/default",
	"tuwunel-api-mas?/default",
	"tuwunel-api-oidc?/default",
	"tuwunel-core/default",
	"tuwunel-service/default",
]

brotli_compression = [
	"tower-http/compression-br",
	"tuwunel-api/brotli_compression",
	"tuwunel-core/brotli_compression",
	"tuwunel-service/brotli_compression",
]
direct_tls = [
	"axum-server/tls-rustls",
	"dep:axum-server-dual-protocol",
	"dep:rustls",
]
gzip_compression = [
	"tower-http/compression-gzip",
	"tuwunel-api/gzip_compression",
	"tuwunel-core/gzip_compression",
	"tuwunel-service/gzip_compression",
]
mas = [
	"dep:tuwunel-api-mas",
]
oidc = [
	"dep:tuwunel-api-oidc",
]
release_max_log_level = [
	"log/max_level_trace",
	"log/release_max_level_info",
	"tracing/max_level_trace",
	"tracing/release_max_level_info",
	"tuwunel-admin/release_max_log_level",
	"tuwunel-api/release_max_log_level",
	"tuwunel-api-admin?/release_max_log_level",
	"tuwunel-api-client/release_max_log_level",
	"tuwunel-api-federation/release_max_log_level",
	"tuwunel-api-mas?/release_max_log_level",
	"tuwunel-api-oidc?/release_max_log_level",
	"tuwunel-core/release_max_log_level",
	"tuwunel-service/release_max_log_level",
]
sentry_telemetry = [
	"dep:sentry",
	"dep:sentry-tower",
	"dep:sentry-tracing",
]
synapse_admin = [
	"dep:tuwunel-api-admin",
]
systemd = [
	"dep:sd-notify",
]
zstd_compression = [
	"tower-http/compression-zstd",
	"tuwunel-api/zstd_compression",
	"tuwunel-core/zstd_compression",
	"tuwunel-service/zstd_compression",
]

[dependencies]
axum-server-dual-protocol.workspace = true
axum-server-dual-protocol.optional = true
axum-server.workspace = true
axum.workspace = true
bytes.workspace = true
const-str.workspace = true
ctor.workspace = true
dtor.workspace = true
futures.workspace = true
http.workspace = true
http-body-util.workspace = true
ipnet.workspace = true
log.workspace = true
ruma.workspace = true
rustls.workspace = true
rustls.optional = true
sentry.optional = true
sentry-tower.optional = true
sentry-tower.workspace = true
sentry-tracing.optional = true
sentry-tracing.workspace = true
sentry.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tuwunel-admin.workspace = true
tuwunel-api.workspace = true
tuwunel-api-admin.optional = true
tuwunel-api-admin.workspace = true
tuwunel-api-client.workspace = true
tuwunel-api-federation.workspace = true
tuwunel-api-mas.optional = true
tuwunel-api-mas.workspace = true
tuwunel-api-oidc.optional = true
tuwunel-api-oidc.workspace = true
tuwunel-core.workspace = true
tuwunel-service.workspace = true

[target.'cfg(all(unix, target_os = "linux"))'.dependencies]
sd-notify.workspace = true
sd-notify.optional = true

[lints]
workspace = true
