[package]
name = "tuwunel_api"
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
bench = false
crate-type = [
	"rlib",
#	"dylib",
]

[features]
default = [
	"brotli_compression",
	"gzip_compression",
	"jwt_login",
	"ldap",
	"release_max_log_level",
	"zstd_compression",
	"tuwunel-core/default",
	"tuwunel-matrix/default",
	"tuwunel-service/default",
]

brotli_compression = [
	"reqwest/brotli",
	"tuwunel-core/brotli_compression",
	"tuwunel-service/brotli_compression",
]
gzip_compression = [
	"reqwest/gzip",
	"tuwunel-core/gzip_compression",
	"tuwunel-service/gzip_compression",
]
jwt_login = [
	"tuwunel-core/jwt_login",
]
ldap = [
	"tuwunel-service/ldap",
]
release_max_log_level = [
	"log/max_level_trace",
	"log/release_max_level_info",
	"tracing/max_level_trace",
	"tracing/release_max_level_info",
	"tuwunel-core/release_max_log_level",
	"tuwunel-matrix/release_max_log_level",
	"tuwunel-service/release_max_log_level",
]
zstd_compression = [
	"reqwest/zstd",
	"tuwunel-core/zstd_compression",
	"tuwunel-service/zstd_compression",
]

[dependencies]
axum-extra.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
const-str.workspace = true
ctor.workspace = true
dtor.workspace = true
futures.workspace = true
hmac.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
ipnet.workspace = true
itertools.workspace = true
log.workspace = true
rand.workspace = true
reqwest.workspace = true
ruma.workspace = true
serde_html_form.workspace = true
serde_json.workspace = true
serde.workspace = true
sha1.workspace = true
synapse-admin-api.workspace = true
tokio.workspace = true
tracing.workspace = true
tower.workspace = true
tower-http.workspace = true
tuwunel-core.workspace = true
tuwunel-matrix.workspace = true
tuwunel-service.workspace = true
url.workspace = true

[lints]
workspace = true
