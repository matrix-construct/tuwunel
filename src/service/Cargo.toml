[package]
name = "tuwunel_service"
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
bench = false
crate-type = [
	"rlib",
#	"dylib",
]

[features]
default = [
	"brotli_compression",
	"console",
	"element_hacks",
	"gzip_compression",
	"ldap",
	"media_thumbnail",
	"release_max_log_level",
	"systemd",
	"url_preview",
	"zstd_compression",
	"tuwunel-core/default",
	"tuwunel-database/default",
	"tuwunel-matrix/default",
]

brotli_compression = [
	"reqwest/brotli",
	"tuwunel-core/brotli_compression",
]
console = [
	"dep:rustyline-async",
	"dep:termimad",
]
element_hacks = []
gzip_compression = [
	"reqwest/gzip",
	"tuwunel-core/gzip_compression",
]
ldap = [
	"dep:ldap3",
]
media_thumbnail = [
	"dep:image",
]
release_max_log_level = [
	"log/max_level_trace",
	"log/release_max_level_info",
	"tracing/max_level_trace",
	"tracing/release_max_level_info",
	"tuwunel-core/release_max_log_level",
	"tuwunel-database/release_max_log_level",
]
systemd = [
	"dep:sd-notify",
]
url_preview = [
	"dep:image",
	"dep:webpage",
]
zstd_compression = [
	"reqwest/zstd",
	"tuwunel-core/zstd_compression",
	"tuwunel-database/zstd_compression",
]

[dependencies]
async-trait.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
const-str.workspace = true
ctor.workspace = true
dtor.workspace = true
derive_more.workspace = true
futures.workspace = true
hickory-resolver.workspace = true
http.workspace = true
image.workspace = true
image.optional = true
ipaddress.workspace = true
ldap3.workspace = true
ldap3.optional = true
lettre.workspace = true
log.workspace = true
loole.workspace = true
lru-cache.workspace = true
object_store.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
ruma.workspace = true
rustls.workspace = true
rustyline-async.workspace = true
rustyline-async.optional = true
serde_html_form.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
subtle.workspace = true
termimad.workspace = true
termimad.optional = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
webpage.workspace = true
webpage.optional = true
tuwunel-core.workspace = true
tuwunel-matrix.workspace = true
tuwunel-database.workspace = true

# killpg, for reaping a video thumbnail program's process group
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(all(unix, target_os = "linux"))'.dependencies]
sd-notify.workspace = true
sd-notify.optional = true

[dev-dependencies]
minicbor-serde.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
