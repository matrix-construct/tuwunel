################################################################################
# Rate limits
#
# Groups request rate limits by kind of request. It holds
# `[global.rate_limiting.login]` for password sign-in; the built-in OIDC
# endpoints have a separate per-IP throttle,
# `authentication.oidc.rc_per_second`.
#
#[global.rate_limiting]


################################################################################
# Password sign-in limits
#
# Three token buckets guard password checks, each in its own sub-section:
# `[global.rate_limiting.login.failed]` counts wrong passwords per account
# and client address, `[global.rate_limiting.login.address]` counts every
# attempt per client address across accounts, and
# `[global.rate_limiting.login.account]` counts successful sign-ins per
# account from any address. They cover `m.login.password` at `/login` and
# the built-in OIDC login page. Password re-entry for sensitive actions
# (UIAA) has its own `failed` and `address` buckets with the same settings
# and no `account` limit. A refused attempt gets `M_LIMIT_EXCEEDED`.
#
# Tips:
# - Behind a reverse proxy, set `http.ip_source` to the header it writes.
#   Without it, password checks use the TCP peer address: a proxy on the
#   same host (or the Unix socket) gets no per-address limit, and every
#   user behind a proxy on another host shares one address.
# - Sign-ins that `[global.ldap]` decides by binding to the directory are
#   not counted; its fallback to the local password is.
# - Buckets are kept in memory and reset on restart.
#
#[global.rate_limiting.login]


################################################################################
# Successful sign-in limit
#
# Caps how often one account can sign in with a correct password, from any
# address: `burst_count` sign-ins at once, then one more every
# 1/`per_second` seconds. Wrong passwords never count, so guessing cannot
# lock the owner out on this axis. A script that logs in repeatedly can
# reach the default limit.
#
#[global.rate_limiting.login.account]

# Token-bucket refill rate (sign-ins per second) for successful password
# logins to one account.
#
# Applies to `/login` with `m.login.password` (but not to the LDAP binds it
# makes) and to the built-in OIDC login page, keyed on the account rather
# than the client IP. Mirrors Synapse's `rc_login.account` and its default
# of `burst_count` sign-ins, then about one every five and a half minutes;
# once those are used up, a correct password is refused with
# `M_LIMIT_EXCEEDED`.
#
# `0` disables this limit rather than making a bucket that never refills.
#
# reloadable: yes
#
#per_second = 0.003

# Token-bucket depth (burst size) for successful password logins to one
# account.
#
# The number of sign-ins allowed before `per_second` governs. `0` disables
# this limit, as does a `0` rate. The default is Synapse's
# `rc_login.account.burst_count`.
#
# reloadable: yes
#
#burst_count = 5


################################################################################
# Per-address attempt limit
#
# Caps all password attempts from one client address across every account,
# successful or not, bounding password spraying and hashing work:
# `burst_count` attempts at once, then one more every 1/`per_second`
# seconds. Clients behind one NAT, one IPv6 /64, or a reverse proxy on
# another host share a budget unless `http.ip_source` names a forwarding
# header. Without one, a loopback peer (a local proxy or the Unix
# socket) is not limited per address.
#
#[global.rate_limiting.login.address]

# Token-bucket refill rate for password attempts per client address.
#
# IPv6 addresses share a bucket within each /64; clients behind a shared
# address share its allowance.
# Public login and authenticated password re-entry use separate buckets.
# Unless `http.ip_source` names a forwarding header, a loopback peer such
# as a local proxy or the Unix socket is not limited per address; configure
# trusted forwarding behind a proxy to limit its clients by address.
#
# `0` disables this limit rather than making a bucket that never refills.
#
# reloadable: yes
#
#per_second = 1.0

# Token-bucket depth for password attempts per client address.
#
# The number of attempts allowed before `per_second` governs.
# `0` disables this limit, as does a `0` rate.
#
# reloadable: yes
#
#burst_count = 20


################################################################################
# Wrong-password limit
#
# Throttles password guessing against one account from one client address.
# Only wrong passwords, including names that match no account, use up the
# allowance: `burst_count` at once, then one more every 1/`per_second`
# seconds. Other addresses keep their own allowance for the same account.
#
#[global.rate_limiting.login.failed]

# Token-bucket refill rate for wrong passwords per account and client
# address.
#
# Every attempt reserves a token before verification; a correct password
# returns it, while a wrong password keeps it.
# An empty bucket refuses even a correct password from that address,
# without blocking the account from other addresses.
# IPv6 addresses share a bucket within each /64, and authenticated
# password re-entry (UIAA) uses separate buckets from public login.
#
# `0` disables this limit rather than making a bucket that never refills.
#
# reloadable: yes
#
#per_second = 0.17

# Token-bucket depth for wrong passwords per account and client address.
#
# The number of failures allowed before `per_second` governs.
# `0` disables this limit, as does a `0` rate.
#
# reloadable: yes
#
#burst_count = 3


################################################################################
# Federated read receipts
#
# Controls whether read receipts are exchanged with other servers. Both
# directions are on by default. Receipts between users of this server work
# regardless of these keys.
#
#[global.read_receipts]

# Allows receiving read receipts from remote servers.
#
# reloadable: yes
#
#allow_incoming = true

# Allows sending read receipts to remote servers.
#
# reloadable: yes
#
#allow_outgoing = true


################################################################################
# Account registration
#
# Controls who may create an ordinary account through `/register` or the
# built-in OIDC login page, and how new accounts are set up. Off by
# default. Terms users must accept live in
# `[global.registration_terms.<ID>]`, and email verification in
# `[global.smtp]`.
#
# With `enable`, startup also requires a registration token (`token` or
# `token_file`) or a required email stage
# (`smtp.require_email_for_registration` with `smtp.connection_uri`).
# Without one the server refuses to start unless
# `yes_i_am_very_very_sure_i_want_an_open_registration_server_prone_to_abuse`
# is true, which startup warns about.
#
# Minimal example (token-gated):
#
#     [global.registration]
#     enable = true
#     token_file = "/etc/tuwunel/.reg_token"
#
# Tips:
# - Startup refuses an empty `token` and an empty or unreadable
#   `token_file`; both may be set. Tokens from `!admin token issue` also
#   work at registration but do not satisfy the startup check.
# - Password registration also needs `authentication.login.with_password`.
#   Identity providers (their `registration` key), `jwt.register_user` and
#   LDAP create accounts without `enable`, and `shared_secret` enables
#   `/_synapse/admin/v1/register` independently of it.
#
#[global.registration]

# Appends text to a new user's display name at registration, separated by
# a space.
#
# Conduit used a lightning-bolt emoji for this suffix. Set to an empty
# string to disable it.
#
# reloadable: yes
#
#displayname_suffix = "💕"

# Enables ordinary new account registration.
#
# When false, ordinary registration is disabled; appservice registration
# is exempt from this switch. Without a configured token, registration
# without a second step requires
# `registration.yes_i_am_very_very_sure_i_want_an_open_registration_server_prone_to_abuse`
# to be true. For token-only registration, configure `registration.token`
# or `registration.token_file`. Ordinary registration also requires
# `authentication.login.with_password`.
#
# reloadable: yes
#
#enable = false

# Opens registration to anyone without restrictions.
#
# This makes the server vulnerable to abuse.
#
# reloadable: yes
#
#yes_i_am_very_very_sure_i_want_an_open_registration_server_prone_to_abuse = false

# Requires new users to supply this static token when creating an
# account.
#
# Configure this value or use `registration.token_file`. If unset while
# `registration.enable` is true, unrestricted registration requires
# `registration.yes_i_am_very_very_sure_i_want_an_open_registration_server_prone_to_abuse`
# to be true.
#
# reloadable: yes
# example: "o&^uCtes4HPf0Vu@F20jQeeWE7"
#
#token =

# Reads additional registration tokens from a file.
#
# Separate multiple tokens with whitespace. The file must be nonempty and
# accessible to the server.
#
# reloadable: yes
# example: "/etc/tuwunel/.reg_token"
#
#token_file =

# Enables out-of-band account creation with a pre-shared secret.
#
# The Synapse-style `/_synapse/admin/v1/register` endpoint requires a
# build with `synapse_admin` and is not routed when MAS delegation is
# active. Configure this value or `registration.shared_secret_file`;
# requests authenticate with HMAC-SHA1 keyed by the resolved secret and
# bypass UIAA. The file takes precedence when successfully read. Use a
# high-entropy secret of at least 32 bytes and protect it like a server
# admin's access token.
#
# reloadable: yes
# example: "kZ2hN5pQ8wXyL4mR7tBfCgJxV3aD6sE1u"
#
#shared_secret =

# Reads the registration shared secret from a file.
#
# This takes precedence over `registration.shared_secret` and falls back
# to it only when the file cannot be read. Surrounding whitespace is
# trimmed, so a trailing newline is not part of the secret. A present but
# blank file resolves to no secret without falling back.
#
# reloadable: yes
# example: "/etc/tuwunel/.reg_shared_secret"
#
#shared_secret_file =

# Lists room IDs or aliases that eligible newly registered users
# automatically join.
#
# The server must already participate in each room, and the user must
# satisfy its normal join authorization rules, including for restricted
# rooms. Rooms are processed in configured order, so an earlier join can
# satisfy a later room's membership requirement. Appservice registrations
# are excluded; guests require `registration.guests.allow_auto_join_rooms`.
# Failed joins are logged without failing registration.
#
# reloadable: yes
# example: ["#tuwunel:grin.hu",
# "!l2xV0sd51lraysuRcsWVECge4NULaH3g-ou95vgDgiM"]
#
#auto_join_rooms = []

# Forbids usernames matching listed patterns.
#
# Use regular expressions or plain words for containment matches, as in
# the example. Checks run during username-availability requests and
# registration, with startup warnings for existing local users whose
# names match.
#
# reloadable: yes
# example: ["administrator", "b[a4]dusernam[3e]", "badphrase"]
#
#forbidden_usernames = []

# Grants admin privileges during eligible registration by joining the
# user to the admin room.
#
# The registering user must be neither a guest nor an appservice user,
# and the registration caller must permit the first-user grant. The admin
# room must exist and have exactly one joined member, normally the server
# user; an empty admin room does not qualify.
#
# reloadable: yes
#
#grant_admin_to_first_user = true


################################################################################
# Guest accounts
#
# Guests are password-less accounts with a generated user ID that a client
# can create without credentials. Off by default.
#
# Tips:
# - Guest registration also requires `registration.enable`, then skips
#   interactive auth (token, email and terms stages), so enabling it on a
#   token-gated server lets anyone create guest accounts.
# - New guests are announced in the admin room only with
#   `admin.room.log_guest_registrations`.
#
#[global.registration.guests]

# Allows registrations with user type "guest".
#
# reloadable: yes
