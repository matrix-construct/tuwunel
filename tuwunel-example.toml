# This caps admin surveys and migrated room and key fanouts. Lower values
# trade sweep latency for load without dropping destinations. 0 selects
# the built-in bounded default.
#
# reloadable: yes
#
#max_width = 0

# Limits destinations contacted by an admin feds survey without
# confirmation.
#
# A room exceeding this requires the command's confirmation flag. Higher
# values permit longer diagnostic commands on the serial admin worker.
#
# reloadable: yes
#
#destination_limit = 2048



#[global.federation.history]

# Limits prior events visited by one recovery traversal.
#
# reloadable: yes
#
# Raising this limit increases recovery work; it is not a count of network
# requests.
#
#max_fetch_prev_events = 1024

# Limits simultaneous backward-extremity upgrades during incoming-event
# recovery.
#
# Lower values reduce recovery load at the cost of latency. This does not
# change the protocol `prev_events` bound or
# `federation.history.max_fetch_prev_events`.
#
# reloadable: yes
#
#prev_events_concurrency = 20

# Limits how many milliseconds an incoming timeline event waits for
# missing previous events before federation fetching.
#
# A gap closing within this window skips the fetch. The event-driven wait
# wakes as soon as those events arrive, so the limit is a ceiling on
# added latency rather than a fixed cost. Set to 0 to fetch immediately.
#
# reloadable: yes
#
#fetch_prev_wait_ms = 750

# Enables experimental federation fetching of missing base events for
# room context requests.
#
# For `/_matrix/client/v3/rooms/{roomId}/context/{eventId}` requests
# whose event is not held locally, we fetch it from a room peer and
# persist it before responding instead of returning a 404. This requires
# `federation.enable` and has no effect when federation is disabled.
# Other on-demand federation fetch sites are gated separately.
#
# reloadable: yes
#
#fetch_unreceived_contexts = false

# Limits concurrent server contacts per round of a federation event
# fetch.
#
# This tightens the built-in fanout profile of every fetch kind and never
# widens one. A value of 0 leaves the profiles unchanged.
#
# reloadable: yes
#
#fetch_fanout_max_width = 0

# Limits staged rounds attempted by a federation event fetch before
# giving up.
#
# This tightens the built-in round count of every fetch kind and never
# raises one. A value of 0 leaves the profiles unchanged.
#
# reloadable: yes
#
#fetch_fanout_rounds = 0



#[global.federation.keys]

# Selects trusted notary servers used to gather other servers' public
# keys.
#
# We do not currently support inbound batched key requests, so this list
# should contain only Synapse servers.
#
# reloadable: yes
# example: ["matrix.org", "tchncs.de"]
#
#trusted_servers = ["matrix.org"]

# Queries configured trusted key servers before the origin when enabled.
#
# Querying the origin first offers the best security by reducing exposure
# to a compromised trusted server. Enabling this can maximize federation
# and join performance, but evaluate the other settings that query
# trusted servers first only under specific high-load conditions before
# enabling it globally.
#
# reloadable: yes
#
#query_trusted_servers_first = false

# Queries configured trusted key servers before origins specifically
# during room joins.
#
# This limits exposure to compromised trusted servers to joins, whose
# many origin-key lookups can cause significant delays; it defaults to
# true to mitigate unexpected delays. Set to false when minimizing that
# exposure matters more than latency. This setting is ignored when
# `federation.keys.query_trusted_servers_first` is true.
#
# reloadable: yes
#
#query_trusted_servers_first_on_join = true

# Queries only trusted key servers and never the origin.
#
# This is intended for clusters or custom deployments using
# `federation.keys.trusted_servers` as forwarding agents to cache and
# deduplicate requests. Notary servers do not act as forwarding agents by
# default, so enable this only with a full understanding of the
# deployment.
#
# reloadable: yes
#
#only_query_trusted_servers = false

# Limits keys requested in each trusted-server batch query.
#
# reloadable: yes
#
#trusted_server_batch_size = 192

# Limits simultaneous request batches when querying a trusted server.
#
# reloadable: yes
#
#trusted_server_batch_concurrency = 2



#[global.federation.transport]

# Sets the federation client read timeout in seconds.
#
# This applies to each read from a remote server rather than the whole
# request, which remains bounded by `network.http.total_timeout`.
#
#timeout = 25

# Sets the timeout in seconds for client-initiated federation key
# lookups.
#
# This covers `/keys/query` and `/keys/claim` against remote servers and
# should be well below `federation.transport.timeout`, so an unresponsive
# server does not outlast the requesting client's send deadline.
# Exceeding this bound records a transient federation failure for the
# remote server, making subsequent lookups back off instead of blocking
# again.
#
#keys_timeout = 8

# Sets the federation client idle connection pool timeout (seconds).
#
#idle_timeout = 25

# Limits idle federation client connections per host, defaulting to one
# because an open connection can generally be reused.
#
#idle_per_host = 1



#[global.http]

# Sets the maximum request size for file uploads.
#
# Accepts an integer byte count or a string with an SI/IEC suffix such as
# "24 MiB".
#
#max_request_size = "24 MiB"

# Sets the maximum time in seconds to receive a client request.
#
#receive_timeout = 75

# Sets the maximum time in seconds to process a client request.
#
#request_timeout = 240

# Sets the maximum time in seconds to transmit a client response.
#
#response_timeout = 120

# Sets the grace period in seconds for clean shutdown of client requests.
#
# reloadable: yes
#
#shutdown_timeout = 15

# Selects the client IP source for rate limiting, logging, and security
# tooling.
#
# When unset, `ClientIp` scans common proxy headers in leftmost-IP mode
# (`X-Forwarded-For`, RFC 7239 `Forwarded`, `X-Real-IP`, `Fly-Client-IP`,
# `True-Client-IP`, `CF-Connecting-IP`, `CloudFront-Viewer-Address`)
# before falling back to the TCP peer address, allowing clients to spoof
# their address through request headers. When set, extraction uses only
# the selected source and takes the rightmost value of multi-valued
# headers, where only the proxy can append, resisting client spoofing;
# header sources still require a trusted reverse proxy in front of
# tuwunel to prevent forgery.
#
# Supported values are "connect_info" for direct TCP peers,
# "rightmost_x_forwarded_for" for nginx or Caddy, "rightmost_forwarded"
# for RFC 7239 proxies, "x_real_ip" for nginx `X-Real-IP`,
# "cf_connecting_ip" for Cloudflare or cloudflared, "true_client_ip" for
# Akamai or Cloudflare Enterprise, "fly_client_ip" for Fly.io, and
# "cloudfront_viewer_address" for AWS CloudFront. Unix-socket deployments
# should leave this unset instead of using "connect_info", which requires
# a TCP peer address; changing this setting requires a server restart.
#
#ip_source = "connect_info"

# Selects TCP peer subnets that bypass the configured client IP source.
#
# Matching peers use the insecure header scan and `ConnectInfo` fallback
# used when `http.ip_source` is unset; entries require CIDR prefixes
# (`/32` or `/128` for a single host), while loopback (`127.0.0.0/8`,
# `::1/128`) always bypasses extraction without being listed. Use this
# for locally attached bridges or server-side clients on private
# container or VPN subnets that cannot carry the configured proxy header,
# such as a Docker bridge without `network_mode: host`.
#
# Exclude the address receiving external traffic from your proxy: listing
# a shared bridge subnet containing the proxy, such as a common Compose
# network, also bypasses proxy traffic and defeats `http.ip_source`. Any
# peer in these subnets can forge client IPs through request headers, so
# include only subnets controlled end-to-end; changing this setting
# requires a server restart.
#
#ip_source_trusted_subnets = ["172.18.0.0/16", "fd00::/8"]

# Sets the `Access-Control-Allow-Origin` header included in all
# responses.
#
# Multiple values may be specified. The default empty list produces the
# header value `*`. Configure this only for a specific purpose, because
# incorrect values can degrade or disrupt clients.
#
#access_control_allow_origin = []



#[global.http.compression]

# Compresses the server's HTTP response bodies with zstd.
#
# This has no effect unless tuwunel was built with the `zstd_compression`
# feature. Most users do not need it, and HTTP compression can weaken
# TLS; review https://breachattack.com/ and
# https://wikipedia.org/wiki/BREACH before enabling it.
#
#zstd = false

# Compresses the server's HTTP response bodies with gzip.
#
# This has no effect unless tuwunel was built with the `gzip_compression`
# feature. Most users do not need it, and HTTP compression can weaken
# TLS; review https://breachattack.com/ and
# https://wikipedia.org/wiki/BREACH before enabling it. Servers in many
# rooms may need it to reduce very large response bodies.
#
#gzip = false

# Compresses the server's HTTP response bodies with brotli.
#
# This has no effect unless tuwunel was built with the
# `brotli_compression` feature. Most users do not need it, and HTTP
# compression can weaken TLS; review https://breachattack.com/ and
# https://wikipedia.org/wiki/BREACH before enabling it.
#
#brotli = false



#[global.http.listen]

# Selects the IPv4 or IPv6 addresses on which tuwunel listens.
#
# Docker or container NAT deployments require "0.0.0.0". To listen on
# multiple addresses, use a vector such as ["127.0.0.1", "::1"]. Every
# explicitly configured address must bind or startup fails. The default
# only assumes both loopback families exist, so a default address that
# cannot bind is logged and skipped.
#
#address = ["127.0.0.1", "::1"]

# Selects the ports on which tuwunel listens.
#
# For reverse proxy setup, see
# https://tuwunel.chat/deploying/generic.html#setting-up-the-reverse-proxy.
# Docker deployments should keep this value and map an external port to
# it. To listen on multiple ports, use a vector such as [8080, 8448].
#
#port = 8008

# Selects the UNIX socket on which tuwunel listens.
#
# The reverse proxy must be able to access this socket file. Add the
# proxy to the 'tuwunel' group or grant world read/write access with
# `http.listen.unix_socket_perms` set to at least 666.
#
# example: "/run/tuwunel/tuwunel.sock"
#
#unix_socket_path =

# Sets the default permissions, in octal, for creating the UNIX socket.
#
#unix_socket_perms = 660



#[[global.identity_provider]]

# The brand-name of the service (e.g. Apple, Facebook, GitHub, GitLab,
# Google) or the software (e.g. keycloak, MAS) providing the identity.
# When a brand is recognized we apply certain defaults to this config
# for your convenience. For certain brands we apply essential internal
# workarounds specific to that provider; it is important to configure this
# field properly when a provider needs to be recognized (like GitHub for
# example).
#
# Several configured providers can share the same brand name. It is not
# case-sensitive. As a convenience for common simple deployments we can
# identify this provider by brand in addition to the unique `client_id` if
# and only if there is a single provider for the brand; see notes for
# `client_id`.
#
#brand =

# The ID of your OAuth application which the provider generates upon
# registration. This ID then uniquely identifies this configuration
# instance itself, becoming the identity provider's ID and must be unique
# and remain unchanged.
#
# As a convenience we also identify this config by `brand` if and only if
# there is a single provider configured for a `brand`. Note carefully that
# multiple providers configured with the same `brand` is not an error and
# this provider will simply not be found when querying by `brand`.
#
#client_id =

# Secret key the provider generated for you along with the `client_id`
# above. Unlike the `client_id`, the `client_secret` can be changed here
# whenever the provider regenerates one for you.
#
#client_secret =

# Secret key to use, read from the file path specified.
#
# Alternative to `client_secret` for deployments that prefer to keep the
# secret outside the config file. When both are configured `client_secret`
# is used and this field is ignored. The file is read at startup and on
# each OAuth exchange, must exist and must be non-empty; leading and
# trailing whitespace is trimmed. Under systemd the path must be visible
# to the service after sandboxing (`ReadWritePaths` / `ProtectHome`),
# typically by placing the file under `/etc/tuwunel/`.
#
# example: "/etc/tuwunel/.client_secret"
#
#client_secret_file =

# Issuer URL the provider publishes for you. We have pre-supplied default
# values for some of the canonical public providers, making this field
# optional based on the `brand` set above. Otherwise it is required to
# find self-hosted providers. It must be identical to what is configured
# and expected by the provider and must never change because we associate
# identities to it. If the `/.well-known/openid-configuration` is not
# found behind this URL see `base_path` below as a workaround.
#
#issuer_url =

# The callback URL configured when registering the OAuth application with
# the provider. Tuwunel's callback URL must be strictly formatted exactly
# as instructed. The URL host must point directly at the matrix server and
# use the following path:
# `/_matrix/client/unstable/login/sso/callback/<client_id>` where
# `<client_id>` is the same one configured for this provider above.
#
#callback_url =

# When more than one identity_provider has been configured and
# `authentication.login.single_sso` is false and
# `authentication.login.sso_custom_providers_page` is false this will
# determine the behavior of the `/_matrix/client/v3/login/sso/redirect`
# endpoint (note the url lacks a trailing `client_id`).
#
# When only one identity_provider is configured it will be interpreted
# as the default and this does not need to be set. Otherwise a default
# *must* be selected for some clients (e.g. fluffychat) to work properly
# when the above conditions require it. To operate out-of-the-box we
# default to one configured provider if none are explicitly default; a
# warning will be logged on startup for this condition.
#
# (EXPERIMENTAL) Multiple providers can be set to default. All providers
# configured with this option set to `true` will associate with the same
# Matrix account when a client flows through
# `/_matrix/client/v3/login/sso/redirect`.
#
# When a user authorizes any provider configured default, the flow will
# include all other providers configured default as well for association.
# NOTE: authorization must succeed for ALL default providers.
#
#default = false

# Optional display-name for this provider instance seen on the login page
# by users. It defaults to `brand`. When configuring multiple providers
# using the same `brand` this can be set to distinguish them.
#
#name =

# Optional icon for the provider. The canonical providers have a default
# icon based on the `brand` supplied above when this is not supplied. Note
# that it uses an MXC url which is curious in the auth-media era and may
# not be reliable.
#
#icon =

# Optional list of scopes to authorize.
#
# An empty array sends `openid email profile`. The exception is
# `brand = "MAS"`, which sends only `openid`: MAS rejects `profile`, and
# its userinfo endpoint returns just `sub` and `username`. Set this to
# request a different subset. The user can further restrict scopes during
# their authorization.
#
#scope = []

# Optional list of userinfo claims which shape and restrict the way we
# compute a Matrix UserId for new registrations. Reviewing Tuwunel's
# documentation will be necessary for a complete description in detail. An
# empty array imposes no restriction here, avoiding generated fallbacks as
# much as possible.
#
# For simplicity we reserve a claim called "unique" which can be listed
# alone to ensure *only* generated ID's are used for registrations.
#
# Note that listing the claim "sub" has special significance and will take
# precedence over all other claims, listed or unlisted. "sub" is not
# normally used to determine a UserId unless explicitly listed here.
#
# As of now arbitrary claims cannot be listed here, we only recognize
# specific hard-coded claims.
#
#userid_claims = []

# Trusted providers can cause username conflicts (i.e. account hijacking)
# but this is precisely how an existing matrix account can be associated
# with a provider. When this option is set to true, the way we compute a
# Matrix UserId from userinfo claims is inverted: we find the first
# matching user and grant access to it. Whereas by default, when set to
# false, we skip matching users and register the first available username;
# falling-back to random characters to avoid conflicts.
#
# Only set this option to true for providers you self-host and control.
# Never set this option to true for the public providers such as GitHub,
# GitLab, etc.
#
# Note that associating an existing user with an untrusted provider is
# still possible but only with the command '!admin query oauth associate'.
#
#trusted = false

# Setting this option to false will inhibit unique ID's from being
# generated as a last-resort when determining a UserId from a provider's
# claims. In the case of untrusted providers, when all provided claims
# conflict with existing user accounts, a unique fallback ID needs
# to be generated for registration to not be denied with an error.
#
# Set this option to false if you operate a private server or a trusted
# identity provider where random UserId's are undesirable; the result of a
# misconfiguration or other issue where an error is warranted.
#
# This option should be set to true for public servers or some users may
# never be able to register.
#
#unique_id_fallbacks = true

# Controls whether new user registration is possible from this provider.
# When this option is set to false, authorizations from this provider
# only affect existing users and will never result in a new registration
# when the claims fail to match any existing user (in the case of trusted
# providers) or an available username is found (in the case of untrusted
# providers).
#
# When LDAP is enabled, a user found in the LDAP directory counts as an
# existing user and is still provisioned on first login, since the
# directory is the authoritative account store.
#
# Setting this option to false is generally not useful unless there is
# an explicit reason to do so.
#
#registration = true

# Optional extra path components after the issuer_url leading to the
# location of the `.well-known` directory used for discovery. If the path
# starts with a slash it will be treated as absolute, meaning overwriting
# any path in the issuer_url. The path needs to end with a slash. This
# will be empty for specification-compliant providers.
#
#base_path =

# Overrides the `.well-known` location where the provider's openid
# configuration is found. It is very unlikely you will need to set this;
# available for developers or special purposes only.
#
#discovery_url =

# Overrides the authorize URL requested during the grant phase. This is
# generally discovered or derived automatically, but may be required as a
# workaround for any non-standard or undiscoverable provider.
#
#authorization_url =

# Overrides the access token URL; the same caveats apply as with the other
# URL overrides.
#
#token_url =

# Overrides the revocation URL; the same caveats apply as with the other
# URL overrides.
#
#revocation_url =

# Overrides the introspection URL; the same caveats apply as with the
# other URL overrides.
#
#introspection_url =

# Overrides the userinfo URL; the same caveats apply as with the other URL
# overrides.
#
#userinfo_url =

# Whether to perform discovery and adjust this provider's configuration
# accordingly. This defaults to true. When true, it is an error when
# discovery fails and authorizations will not be attempted to the
# provider.
#
#discovery = true

# The duration in seconds before a grant authorization session expires.
#
#grant_session_duration = 300

# Whether to check the redirect cookie during the callback. This is a
# security feature and should remain enabled. This is available for
# developers or deployments which cannot tolerate cookies and are willing
# to tolerate the risks.
#
#check_cookie = true

# Extra query parameters appended to every authorization request sent to
# the identity provider.
#
# E.g. to force re-authentication even if IdP cookies are present:
# ```toml
# [[global.identity_provider]]
# extra_authorization_parameters = { prompt = "login" }
# ```
#
#extra_authorization_parameters = {}

# Forward the MSC3824 `action` query parameter from the SSO redirect
# endpoints to this provider as an OpenID Connect `prompt` value.
#
# When a client appends `action=register` to a `/login/sso/redirect`
# request the upstream authorization request carries `prompt=create`
# (the OpenID Connect "Initiating User Registration" extension) so the
# provider can present its registration screen. `action=login` is left
# unforwarded to avoid forcing a re-authentication, and a `prompt` set in
# `extra_authorization_parameters` still applies in that case. An
# action-derived `prompt` takes precedence over one configured there.
#
# Leave this disabled unless the provider supports the `prompt=create`
# registration extension; a provider that does not may reject or ignore
# the request.
#
#forward_action_prompt = false



#[global.jwt]

# Enable JWT logins
#
# reloadable: yes
#
#enable = false

# Validation key, also called 'secret' in Synapse config. The type of key
# can be configured in 'format', but defaults to the common HMAC which
# is a plaintext shared-secret, so you should keep this value private.
#
# reloadable: yes
#
#key =

# Format of the 'key': HMAC, B64HMAC, ECDSA, or EDDSA, case-insensitive.
#
# HMAC is a plaintext shared secret, and B64HMAC (also spelled HMACB64)
# is the same secret base64-encoded in the standard alphabet with '='
# padding, for random binary secrets that cannot be pasted as text.
# ECDSA and EDDSA are PEM-encoded public keys, EDDSA for Ed25519.
# Startup and reload both refuse an unknown format while JWT is enabled.
#
# reloadable: yes
#
#format = "HMAC"

# Automatically create new user from a valid claim, otherwise access is
# denied for an unknown even with an authentic token.
#
# reloadable: yes
#
#register_user = true

# Signature algorithm for validating tokens.
#
# The name must suit the key format: HS256, HS384, or HS512 for HMAC
# and B64HMAC, ES256 or ES384 for ECDSA, and EdDSA for EDDSA.
#
# reloadable: yes
#
#algorithm = "HS256"

# Optional audience claim list. The token must claim one or more values
# from this list when set.
#
# reloadable: yes
#
#audience = []

# Optional issuer claim list. The token must claim one or more values
# from this list when set.
#
# reloadable: yes
#
#issuer = []

# Require expiration claim in the token. This defaults to false for
# synapse migration compatibility.
#
# reloadable: yes
#
#require_exp = false

# Require not-before claim in the token. This defaults to false for
# synapse migration compatibility.
#
# reloadable: yes
#
#require_nbf = false

# Validate expiration time of the token when present. Whether or not it is
# required depends on require_exp, but when present this ensures the token
# is not used after a time.
#
# reloadable: yes
#
#validate_exp = true

# Validate not-before time of the token when present. Whether or not it is
# required depends on require_nbf, but when present this ensures the token
# is not used before a time.
#
# reloadable: yes
#
#validate_nbf = true

# Bypass validation for diagnostic/debug use only.
#
# reloadable: yes
#
#validate_signature = true



#[global.ldap]

# Whether to enable LDAP login.
#
# reloadable: yes
# example: "true"
#
#enable = false

# URI of the LDAP server.
#
# reloadable: yes
# example: "ldap://ldap.example.com:389"
#
#uri =

# Root of the searches.
#
# reloadable: yes
# example: "ou=users,dc=example,dc=org"
#
#base_dn =

# Bind DN if anonymous search is not enabled.
#
# You can use the variable `{username}` that will be replaced by the
# entered username. In such case, the password used to bind will be the
# one provided for the login and not the one given by
# `bind_password_file`. Beware: automatically granting admin rights will
# not work if you use this direct bind instead of a LDAP search.
#
# reloadable: yes
# example: "cn=ldap-reader,dc=example,dc=org" or
# "cn={username},ou=users,dc=example,dc=org"
#
#bind_dn = ""

# Path to a file on the system that contains the password for the
# `bind_dn`.
#
# The server must be able to access the file, and it must not be empty.
#
# reloadable: yes
#
#bind_password_file = ""

# Search filter to limit user searches.
#
# You can use the variable `{username}` that will be replaced by the
# entered username for more complex filters.
#
# reloadable: yes
# example: "(&(objectClass=person)(memberOf=matrix))"
#
#filter = "(objectClass=*)"

# Attribute to use to uniquely identify the user.
#
# reloadable: yes
# example: "uid" or "cn"
#
#uid_attribute = "uid"

# Root of the searches for admin users.
#
# Defaults to `base_dn` if empty.
#
# reloadable: yes
# example: "ou=admins,dc=example,dc=org"
#
#admin_base_dn =

# The LDAP search filter to find administrative users for tuwunel.
#
# If left blank, administrative state must be configured manually for each
# user.
#
# You can use the variable `{username}` that will be replaced by the
# entered username for more complex filters.
#
# reloadable: yes
# example: "(objectClass=tuwunelAdmin)" or "(uid={username})"
#
#admin_filter =



#[global.media]

# Limits the number of concurrent pending asynchronous media uploads per
# user.
#
# reloadable: yes
#
#max_pending_uploads = 5

# Sets the lifetime in seconds before an unused pending MXC URI expires
# and is removed.
#
# reloadable: yes
#
#create_unused_expiration_time = 86400 (24 hours)

# Limits media create requests per second from one user.
#
# reloadable: yes
#
#rc_create_per_second = 10

# Limits the burst count of media create requests from one user.
#
# reloadable: yes
#
#rc_create_burst_count = 50

# Sets the writable space threshold below which local media uploads are
# refused.
#
# Each local storage provider receiving the upload is checked, excluding
# blocks reserved for privileged processes. Media is stored beside the
# database by default, and a full disk prevents database writes, so
# uploads stop first with M_RESOURCE_LIMIT_EXCEEDED and resume when space
# returns. Remote media, URL previews, and thumbnails are never refused.
# Accepts an integer byte count or an SI/IEC string such as "10 GiB"; 0
# disables the check for cases such as a network mount reporting no free
# space.
#
# reloadable: yes
#
#upload_min_free_space = "1 GiB"

# Prevents media from being embedded in frames, including same-origin
# frames.
#
# The default is disabled for compatibility with attachment viewers.
# Enabling it adds `frame-ancestors 'none'` to download and thumbnail
# Content-Security-Policy headers. Changes require a restart, and reverse
# proxy headers may still prevent framing.
#
#deny_framing = false

# Prevents inline styles in media documents.
#
# The default is disabled so browser image viewers retain their
# presentation styles. Enabling it omits `style-src 'unsafe-inline'` from
# download and thumbnail Content-Security-Policy headers. Changes require
# a restart, and reverse proxy headers may still restrict styles.
#
#deny_inline_styles = false

# Enables the legacy unauthenticated Matrix media repository endpoints.
#
# These are `/_matrix/media/*/config`, `/_matrix/media/*/preview_url`,
# `/_matrix/media/*/download/*`, and `/_matrix/media/*/thumbnail/*`. The
# authenticated equivalents are always enabled. The default is false.
#
#allow_legacy = false

# Falls back to requesting legacy unauthenticated media from remote
# servers.
#
# Unauthenticated media was removed around the third quarter of 2024.
# Enabling this adds considerable federation requests that are unlikely
# to succeed.
#
# reloadable: yes
#
#request_legacy = false

# Permits fetching remote legacy content and thumbnails when true.
#
# When false, those remote legacy requests are rejected.
#
# reloadable: yes
#
#freeze_legacy = true

# Checks media directory consistency at startup.
#
# Together with `media.compat_file_link`, this upgrades media when
# switching between Conduit and tuwunel; both options must be enabled.
# Startup checks can also remove database entries for files deleted from
# the media directory. If neither check applies and the directory is
# large, disabling this may reduce startup time.
#
#startup_check = true

# Creates media symlinks for compatibility with Conduit's media
# directory.
#
# This is needed only when planning to use Conduit again; disabling it
# reduces filesystem clutter and symlink management overhead. It is
# disabled by default. Before returning to upstream Conduit, run tuwunel
# at least once with this enabled and allow `media.startup_check` to
# finish before shutdown.
#
#compat_file_link = false

# Removes missing media metadata during startup checks.
#
# Deleting files from the media directory then removes their
# corresponding database entries. This is disabled by default because
# accidentally moving the directory or making it inaccessible would
# otherwise lose database metadata.
#
#prune_missing = false

# Selects storage providers used for media.
#
# Configure each listed name at `global.storage_provider.<NAME>.<brand>`;
# multiple entries support advanced features and future extensions, but
# require checking related settings to avoid resource duplication costs
# and poor performance. The default `["media"]` is an implicit provider
# for the local media directory. Configure
# `global.storage_provider.media.local` to alter it, or omit "media" from
# this list to disable it. Existing deployments should retain "media" as
# a fallback alongside a new provider.
#
# reloadable: yes
#
#storage_providers = ["media"]

# Selects configured storage providers that receive new media.
#
# When not explicitly configured, all entries in
# `media.storage_providers` are used. Each selected provider must also
# appear there. This supports passive migration by writing to a new
# provider while querying the old one as a fallback, for example
# `media.storage_providers = ["media", "media_on_s3"]` with
# `media.store_on_providers = ["media_on_s3"]`.
#
# reloadable: yes
#
#store_on_providers = []

# Redirects local media downloads when the client requests
# `allow_redirect=true` under MSC3860.
#
# If a configured provider can presign the object, such as S3, the server
# returns a 307 redirect to a short-lived URL instead of proxying the
# bytes. Media stored only on the local filesystem is always served
# directly.
#
# reloadable: yes
#
#allow_redirect = false

# Lists server-name regex patterns from which remote media downloads are
# refused.
#
# reloadable: yes
# example: ["badserver\.tld$", "badphrase", "19dollarfortnitecards"]
