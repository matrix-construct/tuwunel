################################################################################
# Registration terms
#
# Requires new users to accept policy documents, such as terms of service
# or a privacy policy, when they register. Each table adds one document to
# the `m.login.terms` stage of registration and to the built-in sign-up
# page (`authentication.oidc.native_auth`). With none configured,
# registration has no terms stage.
#
# - `<ID>`: the policy id sent to clients, such as `terms_of_service`.
#   Checked at startup: 1 to 255 characters from `0-9 a-z A-Z . _ ~ -`.
#   Bare keys may use `A-Z a-z 0-9 _ -`, so an id with `.` or `~` must be
#   quoted (`[global.registration_terms."tos.v2"]`); an unquoted dot
#   splits the name into nested tables.
#
# `version` and a `[global.registration_terms.<ID>.translations.<LANG>]`
# table are required; give it at least one language.
#
# Minimal example:
#
#     [global.registration_terms.terms_of_service]
#     version = "1.0"
#
#     [global.registration_terms.terms_of_service.translations.en]
#     name = "Terms of Service"
#     url = "https://example.com/terms"
#
# Tips:
# - A terms stage does not satisfy the open-registration startup check:
#   `registration.enable` still needs a registration token or a required
#   email stage.
# - Only new accounts see the terms (appservice and guest registrations
#   skip them); changing `version` does not ask existing users again.
#
#[global.registration_terms.<ID>]

# Version of this policy document, presented to the client. Configuring
# any `[global.registration_terms.<ID>]` block makes registration
# require an `m.login.terms` stage listing every such document; the
# `<ID>` is the policy id sent to clients.
#
# example: "1.2"
# reloadable: yes
#
#version =


################################################################################
# Registration terms translation
#
# One language version of a `[global.registration_terms.<ID>]` document:
# the title and link shown for that language. Every translation's `url`
# is recorded as accepted in the new account's `m.accepted_terms` account
# data.
#
# - `<ID>`: the `<ID>` of the policy table this translation belongs to,
#   spelled (and quoted) the same way.
# - `<LANG>`: the language code, such as `en`, `fr` or `en-US` (RFC 5646;
#   some clients use `en_US`). It is sent as the key for this translation
#   next to the policy's `version`, so it must not be `version`; it is not
#   validated otherwise. Bare keys may use `A-Z a-z 0-9 _ -`; anything
#   else must be quoted, and an unquoted dot splits the name into nested
#   tables.
#
# `name` and `url` are required; a `url` whose scheme is not `http` or
# `https` fails the startup check.
#
# Tips:
# - The built-in sign-up page (`authentication.oidc.native_auth`) links
#   one translation per policy: `en` when present, otherwise the first
#   `<LANG>` in sort order.
#
#[global.registration_terms.<ID>.translations.<LANG>]

# User friendly name of the policy document in this language.
#
# example: "Terms of Service"
# reloadable: yes
#
#name =

# Link to the text of the policy document. Must be a valid http(s) URL.
#
# example: "https://example.org/terms-1.2-en.html"
# reloadable: yes
#
#url =


################################################################################
# QR code sign-in
#
# Relays the short handshake between a new device and a signed-in one
# during QR code sign-in (MSC4108 and MSC4388), before an OAuth device
# grant completes the login. On by default, but sessions can be created
# only while the built-in OIDC server runs, which needs `well_known.client`
# plus an `identity_provider` or `authentication.oidc.native_auth`.
# Sessions live in memory and are lost on restart.
#
# Tips:
# - Reverse proxies must not cache or compress responses under the
#   rendezvous paths; compression weakens the `ETag` and sign-in fails
#   right after the scan. See
#   <https://tuwunel.chat/authentication/qr-login.html>.
#
#[global.rendezvous]

# Enables QR sign-in rendezvous sessions under
# [MSC4108](https://github.com/matrix-org/matrix-spec-proposals/pull/4108)
# and
# [MSC4388](https://github.com/matrix-org/matrix-spec-proposals/pull/4388).
#
# Sessions relay the handshake between two devices before an OAuth
# device-authorization grant completes sign-in, requiring the built-in
# OIDC server. When disabled, clients hide the feature and the endpoints
# return an unrecognized response.
#
# reloadable: yes
#
#enable = true

# Limits rendezvous session payloads in bytes, with a default much larger
# than normal QR sign-in handshake messages.
#
# reloadable: yes
#
#session_max_bytes = 4096

# Sets the rendezvous session lifetime in seconds after its last write.
#
# Each update restarts the window, but the device showing the QR code
# times the whole sign-in against the expiry advertised at creation. The
# default allows time for interactive account login on the approval page.
#
# reloadable: yes
#
#session_ttl = 600

# Limits concurrent rendezvous sessions.
#
# Creating beyond the limit evicts the oldest session instead of failing.
# Zero retains one session so creation remains available.
#
# reloadable: yes
#
#max_sessions = 100

# Requires an access token for
# [MSC4388](https://github.com/matrix-org/matrix-spec-proposals/pull/4388)
# session creation.
#
# When enabled, discovery tells a client without a token that it cannot
# create a session. The
# [MSC4108](https://github.com/matrix-org/matrix-spec-proposals/pull/4108)
# endpoint stays open in either mode.
#
# reloadable: yes
#
#authenticated_only = true

# Sets the per-client-IP refill rate for
# [MSC4388](https://github.com/matrix-org/matrix-spec-proposals/pull/4388)
# rendezvous requests.
#
# Zero is treated as one request per second.
#
# reloadable: yes
#
#rc_per_second = 10

# Sets the token-bucket depth for the rendezvous request throttle under
# [MSC4388](https://github.com/matrix-org/matrix-spec-proposals/pull/4388).
#
# This is the requests one client IP can make in a burst before
# `rendezvous.rc_per_second` governs replenishment. Zero is treated as
# one.
#
# reloadable: yes
#
#rc_burst_count = 20


################################################################################
# RocksDB storage engine
#
# Tunes the RocksDB engine behind the database at `database_path`. Every
# key is read when the database opens, so changes need a restart. The
# defaults assume SSD or NVMe storage, and most keys only trade memory,
# threads or log volume for speed or diagnostics.
#
# The recovery keys are different: `recovery_mode` 2 or 3 and `repair`
# can discard data, so back up `database_path` first and revert them once
# the server starts cleanly.
#
# Tips:
# - On btrfs or ZFS set `allow_fallocate = false`; startup warns while it
#   is left on there. On ZFS also set `direct_io = false`.
# - `recovery_mode` accepts 0 to 3; a larger value panics at startup.
# - `cache.capacity_modifier` also scales `write_buffer_capacity_mb`.
#
#[global.rocksdb]

# Sets the memory available to database read caches as a float in megabytes.
#
# Increasing this may improve performance when memory is available; like
# individual LRU caches, the default scales with CPU core count to 128.0 + (64.0
# * CPU core count).
#
#cache_capacity_mb = varies by system

# Sets the memory available to database write caches as a float in megabytes.
#
# Increasing this may improve performance when memory is available; like
# individual LRU caches, the default scales with CPU core count to 48.0 + (4.0 *
# CPU core count).
#
#write_buffer_capacity_mb = varies by system

# Sets the log level for RocksDB LOG files in the database directory.
#
# This differs from the application log level; tuwunel still reports RocksDB
# errors through tracing or panics on severe errors for safety.
#
#log_level = "error"

# Routes RocksDB log messages to standard error.
#
# `rocksdb.log_level` still filters the emitted records. When disabled,
# RocksDB uses the application's callback logger instead.
#
#log_stderr = false

# Sets the maximum RocksDB LOG file size before rotation.
#
# Accepts an integer byte count or a string with SI/IEC suffix such as "4 MiB".
#
#max_log_file_size = 4194304

# Time in seconds before RocksDB will forcibly rotate logs.
#
#log_time_to_roll = 0

# Uses RocksDB tunings tailored to spinning disks (HDDs).
#
# Leave this disabled on NVMe or SSD storage. When enabled, RocksDB skips
# compaction readahead and parallel file-open threads at startup. This does not
# affect Direct IO; see `rocksdb.direct_io`.
#
#optimize_for_spinning_disks = false

# Enables direct-io to increase database performance via unbuffered I/O.
#
# For more details about direct I/O and RockDB, see:
# https://github.com/facebook/rocksdb/wiki/Direct-IO
#
# Set this option to false if the database resides on a filesystem which
# does not support direct-io like FUSE, or any form of complex filesystem
# setup such as possibly ZFS.
#
#direct_io = true

# Sets the number of RocksDB threads for cleanup, sync, flush, and compaction.
#
# The stored value 0 selects the available logical thread count, with a minimum
# of two.
#
#parallelism_threads = 0

# Sets the maximum number of RocksDB LOG files retained.
#
# This must be at least 1, never 0. The default is 3 because these logs are
# mainly useful for troubleshooting or debugging RocksDB bugs.
#
#max_log_files = 3

# Sets the RocksDB database compression algorithm.
#
# Available options are "zstd", "bz2", "lz4", or "none", which disables
# compression. ZSTD balances speed, storage, IO amplification, and CPU usage;
# LZ4 offers more performance and lower CPU usage with less compression and more
# storage use. See https://github.com/facebook/rocksdb/wiki/Compression for
# details.
#
#compression_algo = "zstd"

# Level of compression the specified compression algorithm for RocksDB to
# use.
#
# Default is 32767, which is internally read by RocksDB as the default
# magic number and translated to the library's default compression level
# as they all differ. See their `kDefaultCompressionLevel`.
#
# Note when using the default value we may override it with a setting
# tailored specifically tuwunel.
#
#compression_level = 32767

# Sets the compression level for the bottommost RocksDB data.
#
# The default 32767 is RocksDB's `kDefaultCompressionLevel`, translated to the
# selected library's default level; tuwunel may override it with a tailored
# setting. Bottommost data is generally old and less frequently accessed, so
# higher compression may be useful; research the chosen algorithm.
#
#bottommost_compression_level = 32767

# Whether to enable RocksDB's "bottommost_compression".
#
# At the expense of more CPU usage, this will further compress the
# database to reduce more storage. It is recommended to use ZSTD
# compression with this for best compression results. This may be useful
# if you're trying to reduce storage usage from the database.
#
# See https://github.com/facebook/rocksdb/wiki/Compression for more details.
#
#bottommost_compression = true

# Sets the database recovery mode for RocksDB WAL corruption.
#
# When corruption prevents startup, use mode 2 (PointInTime) to recover to the
# last good state, seconds or minutes before the crash. Clients may need
# "clear-cache & reload" after this rollback. After recovery succeeds, reset the mode
# to its default and restart. In some cases the corruption error persists for at
# least 30 minutes of operation in PointInTime mode.
#
# Only as a last resort if PointInTime fails, try mode 3
# (SkipAnyCorruptedRecord), which may leave the server inconsistent. Default
# mode 1 (TolerateCorruptedTailRecords) drops only the last entry if corrupted
# during shutdown, with an extraordinarily low risk of desynchronizing clients.
# Mode 0 (AbsoluteConsistency) disables all silent rollback. See
# https://github.com/facebook/rocksdb/wiki/WAL-Recovery-Modes for mode details
# and https://tuwunel.chat/troubleshooting.html#database-corruption for recovery
# guidance.
#
#recovery_mode = 1

# Enables paranoid SST file checks.
#
# Additional safety checks may improve database consistency at a performance
# cost; see the RocksDB documentation for details:
# https://github.com/facebook/rocksdb/wiki/Online-Verification#columnfamilyoptionsparanoid_file_checks
#
#paranoid_file_checks = false

# Enables runtime checksum verification in RocksDB.
#
# Checksums are enabled by default and usually hardware accelerated with low
# overhead. Older or slower platforms may gain performance by disabling them.
#
#checksums = true

# Enables RocksDB atomic flush mode.
#
# This option is not intended for users and may be removed or ignored in future
# versions. It may improve database integrity at the cost of performance.
#
#atomic_flush = false

# Enables database repair for RocksDB SST corruption.
#
# Use this when the server reports corruption while running or panics,
# especially for errors containing SST after startup; if startup fails, try
# recovery mode first. Back up the database directory before running repair.
# Disable repair mode and restart the server after repair finishes. See
# https://tuwunel.chat/troubleshooting.html#database-corruption for recovery
# details.
#
#repair = false

# Opens RocksDB in read-only mode.
#
# Writes are rejected and missing column families cannot be created. This
# mode is disabled by default.
#
#read_only = false

# Opens RocksDB as a secondary follower of a primary instance.
#
# Writes are rejected while the primary's latest WAL can be replayed into
# this instance's view. Missing column families cannot be created.
#
#secondary = false

# Enables idle CPU priority for the compaction thread.
#
# This is disabled by default to prevent compaction from falling too far behind
# on busy systems.
#
#compaction_prio_idle = false

# Enables idle IO priority for the compaction thread.
#
# This is enabled by default and usually advisable to prevent unexpected server
# lag.
#
#compaction_ioprio_idle = true

# Enables RocksDB compaction.
#
# You should never need to disable this; if troubleshooting or a bug appears to
# require it, contact the tuwunel Matrix room with details. Disabling compaction
# causes explosive database growth, gradually poor performance, excessive disk
# reads and writes, and slower shutdowns and startups.
#
#compaction = true

# Sets the level of database statistics collection from 0 to 6.
#
# Some admin commands that display database statistics require this setting;
# higher levels may affect performance. Level 0 disables statistics, level 1
# disables them in release mode and is the default, levels 2 to 3 have no
# performance impact, levels 3 to 5 may affect performance, and level 6 collects
# all statistics.
#
#stats_level = 1

# Ignores the list of dropped columns set by developers.
#
# This should be set to true when knowingly moving between versions in
# ways which are not recommended or otherwise forbidden, or for
# diagnostic and development purposes; requiring preservation across such
# movements.
#
# The developer's list of dropped columns is meant to safely reduce space
# by erasing data no longer in use. If this is set to true that storage
# will not be reclaimed as intended.
#
#never_drop_columns = false

# Allows RocksDB to preallocate WAL logs.
#
# Normally, RocksDB allocates certain types of files by calling
# fallocate, writing the file contents, then truncating the logs to the
# proper size. This causes pathological disk space usage on btrfs due to
# how it interacts with its Copy-on-Write implementation. On ZFS,
# fallocate(2) for preallocation is unsupported and returns EOPNOTSUPP;
# only `FALLOC_FL_PUNCH_HOLE` and `FALLOC_FL_ZERO_RANGE` are implemented.
#
# Set this to false if you run the server on btrfs or ZFS, and do not
# touch it otherwise.
#
#allow_fallocate = true


################################################################################
# Room creation, versions and lifecycle
#
# Defaults for rooms created here (version, federation, power levels), who
# may create rooms and aliases, which room versions this server accepts,
# and what happens when users leave. Creation defaults apply only to rooms
# created after a change. The room directory is configured separately in
# `[global.directory.rooms]`.
#
# Sub-sections:
#
# - `[global.rooms.extremities]`: forward-extremity pruning.
# - `[global.rooms.invites]`: invite restrictions and automatic acceptance.
# - `[global.rooms.joins]`: server selection when joining remote rooms.
# - `[global.rooms.policy_server]`: room policy servers (MSC4284).
# - `[global.rooms.redaction]`: redaction, retained originals, erasure.
# - `[global.rooms.relations]`: optional edit and reference bundles.
#
# Tips:
# - Startup fails when `default_version` names a version that is not
#   enabled. Stable versions (6 and later) always are; 3 to 5 only while
#   `allow_unstable_versions` is on (the default).
# - `default_power_level_content_override` must be a table, such as
#   `{ users_default = 50 }`; any other value fails startup.
# - `forbidden_alias_names` entries are regular expressions. An entry that
#   reads as a dotted name draws a startup warning; escape the dot
#   (`"a\\.b"`) to match it literally.
#
#[global.rooms]

# Sets the default `m.federate` property for newly created rooms when the
# client does not request one.
#
# When both this setting and `federation.enable` are false, we always
# override the client-requested `m.federate` value to false. Rooms
# permanently retain the setting chosen at creation, so changing this
# value affects only new rooms.
#
# reloadable: yes
#
#federate_by_default = true

# Calls `/forget` on the user's behalf whenever they leave a room.
#
# This implements
# [MSC4267](https://github.com/matrix-org/matrix-spec-proposals/pull/4267),
# automatically forgetting rooms on leave.
#
# reloadable: yes
#
#forget_forced_upon_leave = false

# Allows standard users to create rooms.
#
# Appservices and admins can always create rooms.
#
# reloadable: yes
#
#allow_creation = true

# Allows standard users to create room aliases.
#
# Appservices and admins can always create room aliases.
#
# reloadable: yes
#
#allow_alias_creation = true

# Allows joining or creating room versions we do not officially support.
#
# Unstable versions may have flawed specifications or a non-conforming
# implementation, so correct operation is not guaranteed even when
# incorrect behavior is tolerable or unnoticed. We officially support
# versions 6 and later, with slightly experimental support for versions 3
# through 5 that works in practice. Set to false to disable these
# unsupported versions.
#
# reloadable: yes
#
#allow_unstable_versions = true

# Enables experimental room versions for developer use.
#
# Unlike unstable versions, these may be under development, prototype
# specification changes, or present serious risks to server operation or
# database integrity. Set to true only for developer use.
#
# reloadable: yes
#
#allow_experimental_versions = false

# Selects the room version used by default when creating rooms.
#
# The default follows the specification but may follow developer
# recommendations.
# Override it only with an understanding that doing so precludes updates
# to newer versions.
#
# reloadable: yes
#
#default_version =

# Sets default power-level overrides for newly created rooms.
#
# This uses the client `/createRoom` parameter's
# `power_level_content_override` shape and is merged before per-request
# overrides, so clients can still override it per room. Only new rooms
# are affected. Top-level keys replace wholesale rather than deep-merge,
# matching the client parameter: `users` or `events` replaces that entire
# computed default submap.
#
# reloadable: yes
#
#default_power_level_content_override = { users_default = 50 }

# Deactivates users who try to join banned rooms or forbidden room
# aliases or server names.
#
# This includes room aliases or IDs with forbidden server names and makes
# the user leave all rooms; federation activity such as remote invites is
# ignored. It can remove the need for admin intervention when banned
# lists contain only toxic rooms or servers that no good-faith user would
# try to join. The default is false because rooms may be banned for
# non-moderation reasons and this performs full account deactivation.
#
# reloadable: yes
#
#auto_deactivate_banned_room_attempts = false

# Forbids room aliases and room IDs matching listed regular expressions.
#
# Patterns can use regular expressions or simple words for containment
# matches, as in the example. Checks run on room alias creation and
# custom room ID creation, with startup warnings for existing database
# aliases with forbidden aliases or IDs.
#
# reloadable: yes
# example: ["19dollarfortnitecards", "b[4a]droom", "badphrase"]
#
#forbidden_alias_names = []

# Deletes rooms after the last local user leaves.
#
# This experimental feature is disabled by default to avoid surprises,
# but deployments conserving space may enable it; it may default to true
# in a future release. Some paths that remove the last local user do not
# yet invoke deletion, so a room can remain afterward.
#
# reloadable: yes
#
#delete_after_leave = false


################################################################################
# Forward-extremity pruning
#
# Forward extremities are a room's newest events that no later event
# references yet; events this server creates cite them as `prev_events`.
# Busy federated rooms can pile them up, so these keys trim the set while
# incoming federation events are processed. The defaults suit most servers.
#
# Tips:
# - `!admin rooms list-extremities` and `!admin rooms prune-extremities`
#   inspect and trim one room on demand.
#
#[global.rooms.extremities]

# Sets the soft cap on forward extremities tracked per room.
#
# When applying an incoming federation event would exceed this cap, we
# prune the least useful leaves from the tracked frontier until it meets
# the cap. Pruned events remain stored and referenceable by other
# servers; we only stop citing them as frontier tips. Events created by
# this server are never pruned, and 0 disables automatic pruning.
#
# reloadable: yes
#
#max = 60

# Sets the emergency bound on a room's forward extremities.
#
# A larger frontier is cut down to this bound in one step, ignoring the
# per-event pruning batch limit. Values at or below
# `rooms.extremities.max` remove pacing entirely and prune straight to
# the cap.
#
# reloadable: yes
#
#emergency_max = 256

# Limits forward extremities pruned by one incoming event between the
# soft cap and emergency bound.
#
# This spreads convergence across events to bound each event's work. A
# value of 0 stops paced pruning and leaves only the emergency bound.
#
# reloadable: yes
#
#prune_batch = 32


################################################################################
# Room invites
#
# Restricts who may send and receive invites, and can accept invites on
# users' behalf. At the defaults neither applies: invites follow the normal
# room rules and wait for the user to answer.
#
# Tips:
# - `auto_accept_direct_only` and `auto_accept_local_only` only narrow
#   `auto_accept`; with `auto_accept = false` they do nothing.
# - `auto_accept` on its own also accepts invites from users on other
#   servers, joining local users to remote rooms; add
#   `auto_accept_local_only` to prevent that.
# - These keys do not filter by server. To refuse everything from a
#   server, invites included, use `federation.forbidden_remote_server_names`.
#
#[global.rooms.invites]

# Blocks non-admin local users from sending local or remote invites and
# non-admin users from receiving remote invites.
#
# Admins can always send and receive all room invites.
#
# reloadable: yes
#
#block_non_admin = false

# Automatically joins local users to any room they are invited to.
#
# The join runs in the background once the invite is recorded, and is
# retried for a short while when a federated invite has not yet settled
# on the inviting server. Users who are deactivated, suspended, or locked
# are never joined.
#
# reloadable: yes
#
#auto_accept = false

# Restricts automatic invite acceptance to direct-message invites.
#
# This restricts `rooms.invites.auto_accept`. The invite must carry
# `is_direct` in its membership content, which clients set when starting
# a direct chat. Invites to any other room are left for the user to
# answer.
#
# reloadable: yes
#
#auto_accept_direct_only = false

# Restricts automatic invite acceptance to invites sent by local users.
#
# This restricts `rooms.invites.auto_accept`. Invites arriving from
# another server are left for the user to answer.
#
# reloadable: yes
#
#auto_accept_local_only = false


################################################################################
# Joining remote rooms
#
# Controls which resident servers this server asks, and how many, when
# joining a room through other servers. At the defaults, servers matching
# `matrix\.org` are tried last and a join request gives up after three
# failed attempts.
#
# Tips:
# - `deprioritize_servers` entries are regular expressions matched against
#   server names. An entry that reads as a dotted name draws a startup
#   warning; write `"example\\.org"`, not `"example.org"`.
#
#[global.rooms.joins]

# Lists server names to try last when joining rooms.
#
# Client-requested joins through these servers try them last, which can
# prevent failed joins caused by a particular server's timeouts.
#
# reloadable: yes
#
#deprioritize_servers = ["matrix\\.org"]

# Limits `make_join` requests within each join attempt.
#
# Each request tries a different server, with each server tried only once
# per attempt. Servers can be retried when the entire join request is
# retried.
#
# reloadable: yes
#
#max_make_join_per_attempt = 48

# Limits join attempts per client join request.
#
# Each attempt contains one or more `make_join` requests bounded by
# `rooms.joins.max_make_join_per_attempt` and one `send_join` request.
# Additional attempts let more servers act as the join server before
# returning the last error to the client.
# The default exceeds one while limiting the risk of exceeding the
# client's request timeout, although exceeding it may sometimes be
# unavoidable.
#
# reloadable: yes
#
#max_attempts_per_request = 3


################################################################################
# Room policy servers (MSC4284)
#
# A room can name a policy server in its `m.room.policy` state event; that
# server is asked to sign each event before it federates. These keys decide
# whether this server takes part. Off by default, in which case policy
# servers are ignored: outgoing events are not sent for signing and
# incoming events are not checked.
#
# Tips:
# - When enabled, an outgoing event the policy server refuses is not sent
#   and the client request fails; an incoming event it refuses is
#   soft-failed. When the policy server cannot be reached, events pass.
# - `request_timeout` has no effect unless `enable = true`.
#
#[global.rooms.policy_server]

# Requests policy-server signatures for outgoing events under
# [MSC4284](https://github.com/matrix-org/matrix-spec-proposals/pull/4284).
#
# For a room with a valid `m.room.policy` state event, we request a
# signature from its policy server's federation `/sign` endpoint before
# federating each event. Refusal aborts the local request; network and
# timeout failures fail open with a warning log so a transient outage
# does not silently take the room offline.
#
# reloadable: yes
#
#enable = false

# Sets the policy-server request timeout in seconds under
# [MSC4284](https://github.com/matrix-org/matrix-spec-proposals/pull/4284).
#
# This applies to outbound `/sign` calls and inbound signature fetches.
#
# reloadable: yes
#
#request_timeout = 5


################################################################################
# Redaction, retained originals and erasure
#
# Governs redactions and what survives them. By default the server keeps
# each redacted event's original content for 60 days, readable by server
# admins and by users whose power level reaches `redact`, and serves erased
# users' events as pruned copies to servers that had no user in the room.
#
# Tips:
# - `retention_seconds = 0` keeps originals forever; otherwise expired
#   originals are removed in an hourly pass.
# - Turning off `save_unredacted_events` stops new copies only; copies
#   already kept stay until `retention_seconds` expires them.
# - `thread_latest_reply_search_limit = 0` fails startup.
#
#[global.rooms.redaction]

# Limits relation rows read by each thread scan during redaction.
#
# Replacing a redacted latest thread reply, and correcting each of a
# member's unread counters after a redacted reply, each read at most this
# many rows; missing, malformed, unrelated, and redacted events consume
# the budget before event filtering. When it runs out, the thread summary
# is omitted and the thread's unread count may stay one too high until a
# thread or unthreaded receipt clears it.
#
# reloadable: yes
#
#thread_latest_reply_search_limit = 1024

# Saves original events before applying redactions.
#
# Retrieve them with `admin debug get-retained-pdu` or
# [MSC2815](https://github.com/matrix-org/matrix-spec-proposals/pull/2815).
#
# reloadable: yes
#
#save_unredacted_events = true

# Sets the redaction retention period in seconds.
#
# By default the unredacted events are stored for 60 days.
#
# reloadable: yes
#
#retention_seconds = 5184000

# Allows users with `redact` power level to request unredacted events
# under
# [MSC2815](https://github.com/matrix-org/matrix-spec-proposals/pull/2815).
#
# Server admins can request unredacted events regardless of this setting.
#
# reloadable: yes
#
#allow_room_admins_to_request_unredacted_events = true

# Prevents local users from sending redactions.
#
# This check does not apply to server admins.
#
# reloadable: yes
#
#disable_local = false

# Serves erased senders' events as pruned copies over federation under
# [MSC4025](https://github.com/matrix-org/matrix-spec-proposals/pull/4025).
#
# A requesting server retains the unredacted view only when one of its
# users was joined in the room state at the event. Join handshakes are
# not gated.
#
# reloadable: yes
#
#enforce_erasure_over_federation = true


################################################################################
# Relation bundles
#
# Adds optional edit and reference summaries to events served to clients.
# Both are off by default; most clients build these themselves, so enable
# one only for a client that relies on it. Thread summaries are always
# bundled and do not depend on these keys.
#
#[global.rooms.relations]

# Bundles the latest message edit under
# [MSC3925](https://github.com/matrix-org/matrix-spec-proposals/pull/3925).
#
# Client read endpoints fold the most recent `m.replace` relation into
# `unsigned.m.relations` as the full replacement event. This is opt-in
# and disabled by default because it adds a typed index seek per served
# event and a server-authoritative summary most clients reconstruct
# locally.
#
# reloadable: yes
#
#bundle_edits = false

# Bundles reference relations under
# [MSC2675](https://github.com/matrix-org/matrix-spec-proposals/pull/2675)
# and
# [MSC3267](https://github.com/matrix-org/matrix-spec-proposals/pull/3267).
#
# Client read endpoints fold `m.reference` relations into
# `unsigned.m.relations` as `{ chunk: [{ event_id }, ...] }`. This is
# disabled by default and adds read-time work when enabled; clients can
# resolve references for polls, beacons, and verification directly.
#
# reloadable: yes
#
#bundle_references = false


################################################################################
# Runtime scheduling
#
# Groups internal scheduling settings. `[global.runtime.stream]` sets how
# much work the server's internal streams run at once and how large their
# database request batches are. The defaults adapt to the hardware
# detected at startup.
#
#[global.runtime]


################################################################################
# Stream concurrency
#
# Sets the concurrency (width) and database batch size (amplification) of
# the server's internal streams. With `width_scale` above zero, both are
# recalculated at startup from the `[global.database.pool]` size, using
# `width_default` and `amplification` as the base values. All keys are
# read once at startup.
#
# Tips:
# - Width is clamped to 1 through 1024 and amplification to 32 through
#   32768.
#
#[global.runtime.stream]

# Sets the initial stream concurrency.
#
# The default is 32. The computed
# `runtime.stream.width_scale` overrides this value unless scaling is
# disabled, in which case it provides a fixed stream width.
#
#width_default = 32

# Scales stream concurrency from the detected system capacity.
#
# The base is the database pool worker count derived from hardware
# queue size, such as 32 for SSDs or 64 or 128+ for NVMe; multipliers
# such as 1.5 or 2.0 increase it, while 0.5 improves responsiveness for
# many users at the cost of per-user throughput. The result cannot
# exceed the pool's worker count per queue, because larger values stall
# the Tokio task. A value of 0.0 fixes the width at
# `runtime.stream.width_default`. The default scale of 1.0 matches
# detected system capabilities.
#
#width_scale = 1.0

# Sets the initial request batch amplification factor.
#
# The factor controls batch sizes submitted by each pool worker,
# multiplying stream throughput independently of specific hardware
# characteristics, so it can greatly exceed thread counts or queue
# sizes. Each database query may require several index lookups,
# allowing queries in a batch to progress independently while sharing
# index and data blocks, whether cached or not. Large batches reduce
# complexity. The maximum is 32768, which still requires sufficient
# hardware.
#
#amplification = 1024


################################################################################
# Outbound delivery queue
#
# Timeouts, retry pacing, worker count and startup behavior for the
# outbound queue that delivers federation transactions, appservice
# transactions and push notifications.
#
# Tips:
# - Every startup trims each destination's failed or unfinished
#   deliveries to the first `startup_netburst_keep` and deletes the rest
#   without retrying, whether or not `startup_netburst` is enabled; `-1`
#   keeps them all.
#
#[global.sending]

# Sets the federation sender request timeout in seconds.
#
#timeout = 180

# Sets the federation sender idle connection pool timeout (seconds).
#
#idle_timeout = 180

# Sets the federation sender transaction retry backoff limit (seconds).
#
# reloadable: yes
#
#retry_backoff_limit = 86400

# Sets the grace period in seconds before retrying a federation
# destination that has failed exactly once.
#
# This replaces the quadratic backoff curve for the first retry, so a
# single transient failure does not hold delivery until the next backoff
# window. A second consecutive failure returns to the backoff curve. Set
# to 0 to disable the grace and back off from the first failure.
#
#retry_grace = 15

# Sets the grace period for clean shutdown of federation requests
# (seconds).
#
# reloadable: yes
#
#shutdown_timeout = 5

# Retries failed and incomplete messages to remote servers immediately at
# startup.
#
# This is called bursting; disabling it retries queued messages on a
# paced timer after startup instead of all at once, reducing startup load
# when resources are extremely limited or deployment scale is huge.
#
#startup_netburst = true

# Caps the unsent messages kept per destination at startup.
#
# The cap applies whether or not `sending.startup_netburst` is enabled,
# and messages past it are dropped and never reattempted. -1 keeps every
# message and can consume significant disk, while 0 drops all messages
# without any redelivery attempt.
#
#startup_netburst_keep = 50

# Sets the number of sender task workers and their parallelism.
#
# The default 0 selects the count internally, likely matching Tokio
# worker threads or CPU cores. Set a nonzero value to override that
# count.
#
#workers = 0


################################################################################
# Outbound email (SMTP)
#
# Sends verification mail so users can prove they own an email address:
# at registration, when adding an address, and for password reset. With
# no `connection_uri`, no mail is sent and those requests are refused.
#
# `connection_uri` needs `sender` and `well_known.client` (verification
# links point there), and the `require_email_*` keys need `connection_uri`;
# otherwise startup fails.
#
# Minimal example:
#
#     [global.well_known]
#     client = "https://matrix.example.com"
#
#     [global.smtp]
#     connection_uri = "smtps://user:pass@mail.example.com:465"
#     sender = "Example <noreply@example.com>"
#
# Tips:
# - `require_email_for_registration` with `connection_uri` adds a
#   verified-email stage to registration, which startup accepts in place
#   of the registration token that `registration.enable` otherwise needs.
# - Verification links open `/_tuwunel/3pid/email/validate` under
#   `well_known.client`; the reverse proxy must forward that path.
# - The built-in OIDC sign-up page cannot collect an email address, so it
#   refuses registration while an email is required.
#
#[global.smtp]

# Connection URL for the outbound SMTP relay used to send email
# verification messages. Setting this enables the email subsystem;
# without it no mail is sent.
#
# Use a `smtp://` URL for an unencrypted or STARTTLS connection and a
# `smtps://` URL for implicit TLS. Credentials and the host go inline:
# `smtps://user:pass@host:port`. The port defaults per scheme when
# omitted.
#
# The userinfo component is URL-encoded, so an `@` inside the username
# must be written as `%40` (for example a login of `bot@example.com`
# becomes `smtps://bot%40example.com:pass@host:465`). Other reserved
# characters in the username or password are percent-encoded the same
# way.
#
# example: "smtps://user:pass@mail.example.com:465"
#
#connection_uri =

# The mailbox that outbound verification messages are sent from. Accepts
# either a bare address or a display-name form.
#
# example: "Example <noreply@example.com>"
#
#sender =

# Rejects email domains matching these regular expressions during registration
# and when adding an email address to an existing account.
#
# Patterns match only the canonical domain: lowercase with `ß` expanded to
# `ss`, without changing plus-addressing or dots. Anchor patterns to match
# whole domains, for example `^example[.]com$` or `(^|[.])example[.]com$`
# to include subdomains; an empty list imposes no domain exclusions.
# Existing bindings and password resets remain usable, while previously
# verified addresses are checked again before registration or addition.
#
# reloadable: yes
#
#forbidden_email_domains = []

# Require a verified email address to complete registration. When set,
# the registration flow does not finish until the user proves control of
# an email address.
#
#require_email_for_registration = false

# Require a verified email address when registering with a registration
# token. When set, token-based registration also demands a verified
# email address.
#
#require_email_for_token_registration = false


################################################################################
# Google Cloud Storage provider
#
# Stores media in a Google Cloud Storage bucket. With no credential keys
# set, credentials come from the environment and finally the instance
# metadata server, so GKE Workload Identity needs no key file.
#
# - `<ID>`: your name for this provider. Media uses a provider only when
#   `media.storage_providers` (default `["media"]`) lists it;
#   `media.store_on_providers` and `media.import.conduit.source_provider`
#   name providers the same way. Listing an undefined id fails startup.
#   `media` is the built-in local provider, and a `media` entry replaces
#   it. Use one backend (`local`, `s3` or `gcs`) per `<ID>`. Bare keys may
#   use `A-Z a-z 0-9 _ -`; anything else must be quoted
#   (`[global.storage_provider."my.media".gcs]`), and an unquoted dot
#   splits the name into nested tables.
#
# `bucket` is the only required key; without it the entry is skipped,
# even when `media.storage_providers` lists it. Skipping it is an error
# only when no enabled provider is left to receive uploads.
#
# Minimal example:
#
#     [global.storage_provider.gcs_media.gcs]
#     bucket = "my-media-bucket"
#
# Tips:
# - `media.storage_providers = ["media", "gcs_media"]` with
#   `media.store_on_providers = ["gcs_media"]` writes new media to GCS and
#   still reads older media from `media`. Without `store_on_providers`,
#   every upload goes to both (startup warns).
# - Providers are built once at startup, so a config reload that adds,
#   removes or changes a provider section is refused; restart instead.
#
#[global.storage_provider.<ID>.gcs]

# The name of the GCS bucket, e.g. "my-media-bucket". Required; an unset
# bucket disables this provider.
#
# A `gs://bucket/path` URL is intentionally not accepted here: the path
# component would not be applied as an object prefix. Set `bucket` and
# `base_path` separately instead.
#
#bucket =

# Optional path prefix within the bucket where all our operations will take
# place.
#
#base_path =

# (expert use) Path to a Google service account key file. Leave unset to
# resolve credentials from the environment, which on GCE/GKE ends at the
# instance metadata server; that is the keyless path and the recommended
# configuration. Setting this requires exported key material.
#
#service_account_path =

# (expert use) Path to an application default credentials file. Leave unset
# to resolve credentials from the environment. Only service-account and
# authorized-user documents are recognised, not every
# external-account/workload-identity-federation file format.
#
#application_credentials_path =

# (expert use) Threshold size for switching to multi-part uploads. This value
# determines what a "large" upload is. The value is a parsed string allowing
# SI or IEC units for convenience.
#
#multipart_threshold = "100 MiB"

# (expert use) Size of each individual part within a multi-part upload. Once
# an upload exceeds `multipart_threshold` the payload is split into parts of
# this size, each sent as a separate request. The value is a parsed string
# allowing SI or IEC units for convenience.
#
#multipart_part_size = "10 MiB"

# (developer use) Allows skipping request signatures.
#
#use_signatures = true

# (developer use) Enables checks performed at startup, such as probing the
# provider. Failures are considered critical startup errors and abort
# startup. When set to false, faulty providers are only discovered on first
# use and will not be fatal errors.
#
# The check is a listing probe: it requires `storage.objects.list`, proves
# neither write nor delete permission, and passes on an empty bucket.
#
#startup_check = true


################################################################################
# Local filesystem storage provider
#
# Stores media files under a local directory. Unless replaced, a built-in
# local provider named `media` keeps media in the `media` directory under
# `database_path`; add a table here to move that directory or to add
# another one.
#
# - `<ID>`: your name for this provider. Media uses a provider only when
#   `media.storage_providers` (default `["media"]`) lists it;
#   `media.store_on_providers` and `media.import.conduit.source_provider`
#   name providers the same way. Listing an undefined id fails startup.
#   `media` is the built-in local provider, and a `media` entry replaces
#   it. Use one backend (`local`, `s3` or `gcs`) per `<ID>`. Bare keys may
#   use `A-Z a-z 0-9 _ -`; anything else must be quoted
#   (`[global.storage_provider."my.media".local]`), and an unquoted dot
#   splits the name into nested tables.
#
# `base_path` is required; an empty value disables the entry. Unless
# `create_if_missing` is set, the directory must already exist or startup
# fails.
#
# Example (moving the built-in `media` directory):
#
#     [global.storage_provider.media.local]
#     base_path = "/srv/tuwunel/media"
#
# Tips:
# - The built-in `media` provider creates its directory; an explicit
#   `media` entry does so only with `create_if_missing`.
# - Providers are built once at startup, so a config reload that adds,
#   removes or changes a provider section is refused; restart instead.
#
#[global.storage_provider.<ID>.local]

# Absolute path to this local filesystem storage provider. Technically the
# provider exists at the filesystem root, and the base_path is prefixed to
# all objects.
#
#base_path =

# Creates the directory on the local filesystem if missing. This is not
# recommended to prevent misconfigured environments and missing mounts
# from silently succeeding.
#
#create_if_missing = false

# Toggles the preservation of a directory after its last file contents are
# removed.
#
#delete_empty_directories = true

# Enables checks performed at startup determining the usability of the
# local directory. Failures will abort the server's startup.
#
#startup_check = true


################################################################################
# S3 storage provider
#
# Stores media in an S3-compatible object store: AWS S3, or another
# service reached through `endpoint`.
#
# - `<ID>`: your name for this provider. Media uses a provider only when
#   `media.storage_providers` (default `["media"]`) lists it;
#   `media.store_on_providers` and `media.import.conduit.source_provider`
#   name providers the same way. Listing an undefined id fails startup.
#   `media` is the built-in local provider, and a `media` entry replaces
#   it. Use one backend (`local`, `s3` or `gcs`) per `<ID>`. Bare keys may
#   use `A-Z a-z 0-9 _ -`; anything else must be quoted
#   (`[global.storage_provider."my.media".s3]`), and an unquoted dot
#   splits the name into nested tables.
#
# Set `url` or `bucket`; with neither, the entry is skipped, even when
# `media.storage_providers` lists it. Skipping it is an error only when no
# enabled provider is left to receive uploads. Keys left unset fall back
# to the standard `AWS_*` environment variables.
#
# Example:
#
#     [global.storage_provider.s3_media.s3]
#     bucket = "my-media-bucket"
#     region = "us-west-2"
#     key = "CHANGE_ME"
#     secret = "CHANGE_ME"
#
# Tips:
# - `media.storage_providers = ["media", "s3_media"]` with
#   `media.store_on_providers = ["s3_media"]` writes new media to S3 and
#   still reads older media from `media`. Without `store_on_providers`,
#   every upload goes to both (startup warns).
# - The path in an `s3://bucket/path` `url` is not used as a prefix; set
#   `base_path` instead.
# - Providers are built once at startup, so a config reload that adds,
#   removes or changes a provider section is refused; restart instead.
#
#[global.storage_provider.<ID>.s3]

# Sets the bucket, and for some forms the region, from an S3 URL.
#
# An `s3://bucket` URL supplies only the bucket, and its path is ignored,
# so set `base_path` for a prefix within the bucket. An AWS `https://` URL
# that names a region (`https://s3.<region>.amazonaws.com/<bucket>` or
# `https://<bucket>.s3.<region>.amazonaws.com`) supplies it too, a
# Cloudflare R2 URL sets it to `auto`, and values taken from the URL
# override `bucket` and `region`.
#
# example: "s3://my-media-bucket"
#
#url =

# The name of the S3 bucket. e.g. "bucketname-123456789-us-west-2-an".
#
#bucket =

# The region of the S3 bucket. e.g. "us-west-2".
#
#region = "us-east-1"

# Your amazon IAM Key ID with access granted to this bucket.
# e.g. "ABCDEFG1X1ZZYYXXWWVV"
#
#key =

# The secret key component which is approx 40 characters of base64.
#
#secret =

# Optional path prefix within the bucket where all our operations will
# take place.
#
#base_path =

# (expert use) Sets the S3 endpoint for self-hosted or other compatible
# services.
#
# A dual-stack AWS or Cloudflare R2 `url` sets its own endpoint, which
# overrides this value.
#
#endpoint =

# (expert use) Turns virtual-hosted-style requests on or off, which some
# self-hosted services need.
#
# A virtual-hosted AWS `url` (`https://<bucket>.s3.<region>.amazonaws.com`)
# turns them on regardless of this value.
#
#use_vhost_request = false

# (expert use) Alternative session-token authentication method.
#
#token =

# (expert use) Associated SSE-KMS key material.
#
#kms =

# (expert use) When configured for the bucket it should be reflected here.
#
#use_bucket_key =

# (expert use) Threshold size for switching to Multi-part uploads. This is
# a quirk of the S3 protocol which requires us to use a different approach
# for "large" uploads. This value determines what a "large" upload is. The
# default value should be sufficient for most providers. The value is a
# parsed string allowing SI or IEC units for convenience.
#
#multipart_threshold = "100 MiB"

# (expert use) Size of each individual part within a Multi-part upload.
# Once an upload exceeds `multipart_threshold` the payload is split into
# parts of this size, each sent as a separate HTTP PUT. Smaller values
# keep individual requests under per-request timeouts on slow uplinks at
# the cost of more round-trips. S3 requires every part except the last
# to be at least 5 MiB. The value is a parsed string allowing SI or IEC
# units for convenience.
#
#multipart_part_size = "10 MiB"

# (developer use) Allows relaxing default requirement forcing HTTPS.
#
#use_https = true

# (developer_use) Allows skipping request header signatures (will be
# reejected by AWS).
#
#use_signatures = true

# (developer_use) Allows disabling request payload signatures.
#
#use_payload_signatures = true

# (developer use) Enables checks performed at startup such as pinging the
# provider. Failures are considered critical startup errors which abort
# startup. When set to false, faulty providers are only discovered with
# first use and will not be fatal errors.
#
# Only set this to false if you expect a provider to be down at startup or
# for development/testing purposes; checks are disabled when the server
# is started in '--maintenance' mode.
#
#startup_check = true


################################################################################
# External telemetry
#
# Sends diagnostics to services outside the server. Both exporters are off
# by default.
#
# - `[global.telemetry.sentry]`: crash, error and performance reports to a
#   Sentry service. Included in the default build.
# - `[global.telemetry.jaeger]`: tracing spans to an OpenTelemetry (OTLP)
#   collector such as Jaeger. Needs a build with the `perf_measurements`
#   Cargo feature.
#
#[global.telemetry]


################################################################################
# Jaeger span export (OpenTelemetry)
#
# Exports tracing spans over OTLP (gRPC) to an OpenTelemetry collector such
# as Jaeger. Off by default, and available only in a build with the
# `perf_measurements` Cargo feature; the default build and the published
# packages ignore these keys.
#
# Tips:
# - There is no key for the collector address. The exporter reads the
#   standard `OTEL_EXPORTER_OTLP_TRACES_ENDPOINT` environment variable (or
#   `OTEL_EXPORTER_OTLP_ENDPOINT`) and otherwise sends to
#   `http://localhost:4317`.
# - Spans arrive under the service name `tuwunel`.
# - In a `perf_measurements` build a malformed `filter` stops startup even
#   with `enable` off.
#
#[global.telemetry.jaeger]

# Enables OTLP span export for Jaeger-compatible tracing.
#
# A build with performance measurements installs an OpenTelemetry layer
# when enabled. The default is false, and `telemetry.jaeger.filter`
# selects exported spans.
#
#enable = false

# Selects tracing spans exported to Jaeger-compatible collectors.
#
#filter = "info"


################################################################################
# Sentry error reporting
#
# Reports panics, error-level log events and a sampled share of performance
# traces to a Sentry service. Support is in the default build, but `enable`
# is off, so nothing is sent until you turn it on. Settings are read once at
# startup; a configuration reload neither starts nor stops reporting.
#
# Set `enable = true` to report. `endpoint` takes a Sentry DSN; the default
# DSN reports to the tuwunel project's Sentry
# (`o4509498990067712.ingest.us.sentry.io`). Set your own DSN to keep
# reports in your Sentry.
#
# Tips:
# - Error events carry the log message and its fields, with recent `info`
#   and `warn` log lines attached as breadcrumbs, so reports can include
#   user IDs and room IDs.
# - Sentry fills its own `server_name` field with the machine's hostname
#   unless `send_server_name` replaces it with the Matrix server name. OS
#   and Rust version details are attached to events as well.
# - With `enable` on, a malformed `filter` stops startup.
#
#[global.telemetry.sentry]

# Enables Sentry crash and panic reporting, performance monitoring, and
# metrics, disabled at runtime by default and sent to the default endpoint
# domain `o4509498990067712.ingest.us.sentry.io` unless overridden.
#
#enable = false

# Selects a custom Sentry reporting URL.
#
#endpoint = ""

# Includes `server_name` in Sentry crash reports and metrics.
#
#send_server_name = false

# Sets the fraction of performance-monitoring traces sampled by Sentry.
#
# When Sentry is enabled, this must be between 0.0 and 1.0 inclusive.
# High values may affect performance; 0.0 disables sampling.
#
#traces_sample_rate = 0.15

# Attaches a stack trace to Sentry reports.
#
#attach_stacktrace = false

# Sends panics to Sentry when telemetry is enabled.
#
# This defaults to true, but `telemetry.sentry.enable` must also be
# enabled before any data is sent.
#
#send_panic = true

# Sends errors to Sentry when telemetry is enabled.
#
# This defaults to true but requires Sentry enablement. It applies only
# in release mode and is forced false in debug mode.
#
#send_error = true

# Selects the tracing log level for Sentry breadcrumbs and transactions.
#
#filter = "info"


################################################################################
# Direct TLS
#
# Lets the server terminate TLS itself. Most deployments leave
# `[global.tls]` unset and let a reverse proxy handle HTTPS and
# certificates, in which case every TCP listener speaks plain HTTP. Use it
# when nothing sits in front of the server, together with a public
# `http.listen.address` and the `http.listen.port` values that clients and
# other homeservers connect to.
#
# Set `certs` to a PEM file holding the full certificate chain and `key`
# to its PEM private key; setting only one of the two fails startup.
#
# Minimal example:
#
#     [global.tls]
#     certs = "/etc/tuwunel/tls/fullchain.pem"
#     key = "/etc/tuwunel/tls/privkey.pem"
#
# Tips:
# - TLS covers every TCP listener, including sockets passed by systemd.
#   One port cannot serve TLS while another serves plain HTTP;
#   `dual_protocol` makes every port accept both. The Unix socket stays
#   plain HTTP.
# - The files are read once at startup; restart after renewing the
#   certificate.
# - Builds without the `direct_tls` feature (on by default) refuse to start
#   while `certs` and `key` are set.
#
#[global.tls]

# Path to a valid TLS certificate file; this section requires a build with
# the `direct_tls` Cargo feature.
#
# example: "/path/to/my/certificate.crt"
#
#certs =

# Path to a valid TLS certificate private key.
#
# example: "/path/to/my/certificate.key"
#
#key =

# Controls whether listeners accept both HTTP and HTTPS.
#
# Plain requests are served without redirecting them to HTTPS. This
# weakens transport security and is disabled by default.
#
#dual_protocol = false


################################################################################
# Developer tracing tools
#
# Diagnostics for developers profiling the server. Neither `tokio_console`
# nor `[global.tracing.flame]` does anything in the default build or the
# published packages, so production servers can leave `[global.tracing]`
# out.
#
# Tips:
# - `tokio_console` needs a build with the `tokio_console` Cargo feature
#   and `--cfg tokio_unstable` in `RUSTFLAGS`, and a release build must
#   also drop the default `release_max_log_level` feature. See
#   <https://tuwunel.chat/development.html#debugging-with-tokio-console>.
#
#[global.tracing]

# Enables tokio-console for developer use as described in the
# [tokio-console debugging
# guide](https://tuwunel.chat/development.html#debugging-with-tokio-console).
#
#tokio_console = false


################################################################################
# Tracing span profiles (flame graphs)
#
# Profiles time spent in the server's tracing spans and writes it to a
# folded-stack file for flame-graph tools. Off by default, and it works only
# in a build with the `perf_measurements` Cargo feature, which the default
# build and the published packages leave out.
#
# Tips:
# - In such a build with `enable` on, an unwritable `output_path` or a
#   malformed `filter` stops startup.
# - Output is buffered, so the file is complete only after the server stops.
#
#[global.tracing.flame]

# Collects folded stack profiles of tracing spans through tracing-flame
# when the `perf_measurements` build feature is enabled, for visualization
# with [inferno](https://github.com/jonhoo/inferno),
# [Speedscope](https://www.speedscope.app), or other compatible tools.
#
#enable = false

# Selects tracing spans included in the folded stack profile.
#
#filter = "info"

# Selects the output path for the folded tracing-span profile.
#
#output_path = "./tracing.folded"


################################################################################
# TURN relay for calls
#
# Tells clients which TURN servers relay their legacy Matrix calls, and
# with what credentials, through `/_matrix/client/v3/voip/turnServer`.
# No TURN server is built in; the guide at
# <https://tuwunel.chat/calls/turn.html> uses coturn. With `uris` empty,
# the default, that endpoint answers 404.
#
# Pick one credential source:
#
# - Shared secret (recommended): `secret` or `secret_file`, equal to
#   coturn's `static-auth-secret`. Each request gets a fresh username
#   `<expiry>:<user_id>` and HMAC-SHA1 password, valid for `ttl` seconds.
# - Static: `username` and `password`, sent to every client as they are;
#   ignored while a secret is set.
#
# With `uris` set and neither source, startup logs a warning and clients
# receive an empty username and password.
#
# Minimal example:
#
#     [global.turn]
#     uris = ["turn:turn.example.com?transport=udp"]
#     secret_file = "/etc/tuwunel/.turn_secret"
#
# Tips:
# - `secret_file` is read on every request, so rotating the secret needs
#   no reload or restart.
# - Guests get 403 from the endpoint unless `allow_guests` is on.
#
#[global.turn]

# Allows guest users to access TURN credentials.
#
# This is equivalent to Synapse's `turn_allow_guests` setting and permits
# guests to call `/_matrix/client/v3/voip/turnServer`.
#
# reloadable: yes
#
#allow_guests = false

# Supplies a static TURN username when the recommended shared secret
# `turn.secret` is not used.
#
# reloadable: yes
#
#username = false

# Supplies a static TURN password when the recommended shared secret
# `turn.secret` is not used.
#
# reloadable: yes
#
#password = false

# Lists TURN server URIs.
#
# Replace "example.turn.uri" with the TURN domain, such as coturn's
# `realm` setting. For TURN over TLS, replace the `turn:` prefix with
# `turns:`.
#
# reloadable: yes
# example: ["turn:example.turn.uri?transport=udp",
# "turn:example.turn.uri?transport=tcp"]
#
#uris = []

# Supplies the TURN shared secret for HMAC-SHA1 credential generation,
# which is more secure than the traditional static username-and-password
# credentials that remain available when needed.
#
# reloadable: yes
#
#secret = false

# Reads the TURN shared secret from a file.
#
# This takes precedence over `turn.secret` and falls back to it when the
# file cannot be opened. Surrounding whitespace is trimmed so a trailing
# newline is not part of the secret. A present but blank file resolves to
# no secret without falling back.
#
# reloadable: yes
# example: "/etc/tuwunel/.turn_secret"
#
#secret_file =

# Sets the TURN lifetime in seconds.
#
# reloadable: yes
#
#ttl = 86400


################################################################################
# Typing notifications
#
# Controls whether typing notifications are exchanged with other servers
# and how long a typing indicator lasts when no stop request arrives.
# Federation is on in both directions by default.
#
# Tips:
# - `client_timeout_min_s` must not exceed `client_timeout_max_s`. Startup
#   and reload refuse an inverted pair.
#
#[global.typing]

# Allows sending typing updates over federation.
#
# reloadable: yes
#
#allow_outgoing = true

# Allows receiving typing updates over federation.
#
# reloadable: yes
#
#allow_incoming = true

# Limits how long a federated user can indicate typing.
#
# reloadable: yes
#
#federation_timeout_s = 30

# Sets the minimum time a local client can indicate typing.
#
# A request to stop typing still takes effect. The minimum applies only
# when no stop request arrives.
#
# reloadable: yes
#
#client_timeout_min_s = 15

# Limits how long a local client can indicate typing.
#
# reloadable: yes
#
#client_timeout_max_s = 45


################################################################################
# Matrix discovery (well-known) responses
#
# Sets what the server answers at `/.well-known/matrix/client`,
# `/.well-known/matrix/server` and `/.well-known/matrix/support`. Clients
# and other servers fetch these files over HTTPS from the `server_name`
# host, so the settings take effect only when requests for that host reach
# the server, directly or through a reverse proxy. An endpoint with nothing
# configured answers 404.
#
# Support contacts and policies have their own tables,
# `[global.well_known.support_contact.<ID>]` and
# `[global.well_known.support_policy.<ID>]`; with `support_page` they make
# up `/.well-known/matrix/support`. `livekit_url` publishes the MatrixRTC
# (Element Call) backend in the client response.
#
# Example for `example.com` served from `matrix.example.com`:
#
#     [global.well_known]
#     client = "https://matrix.example.com"
#     server = "matrix.example.com:443"
#
# Tips:
# - Other features need `client`: startup fails when `smtp.connection_uri`
#   is set without it, and the built-in OIDC server (any
#   `[global.identity_provider]` entry or `authentication.oidc.native_auth`)
#   stays off with a warning.
#
#[global.well_known]

# The server URL that the client well-known file will serve.
#
# This should not contain a port, and should just be a valid HTTPS URL.
# While this is unset, `/.well-known/matrix/client` answers 404 and
# auto-discovery from the server name yields nothing, so the base URL has
# to reach clients some other way. Leave it unset only when a reverse
# proxy or another host publishes that file for this domain.
#
# example: "https://matrix.example.com"
#
#client =

# The server base domain of the URL with a specific port that the server
# well-known file will serve. This should contain a port at the end, and
# should not be a URL.
#
# reloadable: yes
# example: "matrix.example.com:443"
#
#server =

# Publishes a support web page URL at `/.well-known/matrix/support`.
#
# It is served beside the support contacts and policies, and any one of
# the three makes the endpoint answer instead of returning 404.
#
# reloadable: yes
# example: "https://example.com/support"
#
#support_page =

# LiveKit JWT endpoint.
# Required for Element Call / MatrixRTC (MSC4143).
#
# Note: You must also set `client` above to your homeserver URL.
#
# reloadable: yes
#
#livekit_url = ""

# Custom MatrixRTC transports.
#
# If you're looking to setup Element Call / MatrixRTC with Livekit,
# you should not use this option and instead set `livekit_url`.
# This is only required if you want to configure a non-livekit MatrixRTC
# transport. There are no known client implementations that support any
# other transport types.
#
# This option was previously the only way to configure a Livekit
# transport. It has been superseded by `livekit_url`.
#
# Example:
# [global.well_known]
# client = "https://matrix.yourdomain.com"
#
# [[global.well_known.rtc_transports]]
# type = "livekit"
# livekit_service_url = "https://livekit.yourdomain.com"
#
# reloadable: yes
#
#rtc_transports = []


################################################################################
# Support contact
#
# Publishes one contact in the `contacts` list of
# `/.well-known/matrix/support`, where users and other server admins look
# for someone to reach. With no contact, `support_page` or support policy
# configured, the endpoint answers 404.
#
# - `<ID>`: your label for this contact. It is not published; contacts
#   are listed in `<ID>` order, and startup errors name the entry by it.
#   Bare keys may use `A-Z a-z 0-9 _ -`; anything else must be quoted
#   (`[global.well_known.support_contact."ops.team"]`), and an unquoted
#   dot splits the name into nested tables.
#
# `role` is required, normally `m.role.admin` or `m.role.security`;
# `m.role.moderator` and `m.role.dpo` are accepted but published under
# their unstable MSC4121 and MSC4265 names. Startup fails unless at least
# one of `email_address` or `matrix_id` is set.
#
# Example:
#
#     [global.well_known.support_contact.admin]
#     role = "m.role.admin"
#     email_address = "admin@example.com"
#     matrix_id = "@admin:example.com"
#
#[global.well_known.support_contact.<ID>]

# The name of the support role.
#
# example: "m.role.admin"
#
#role =

# The email address for the above support role.
#
# example: "admin@example.com"
#
#email_address =

# The Matrix User ID for the above support role.
#
# example: "@admin:example.com"
#
#matrix_id =

# The PGP key (i.e. OpenPGP) that one may use for encrypted communications
# for the above support role. The value must be a URI. Use a web URL
# pointing to the key (for example "https://example.com/key.asc"), an
# OPENPGPKEY DNS record ("dns:..."), or a fingerprint carried with the
# "openpgp4fpr:" scheme. A bare fingerprint without a scheme, or raw
# inlined key material, is rejected at startup.
#
# As this is a spec proposal (MSC4439), the identifier/prefix for this
# field is currently "dev.zirco.msc4439.pgp_key"
#
# example: "openpgp4fpr:8B77919975EAFA5E2456EE03665FE73077489DB0"
#
#pgp_key =


################################################################################
# Support policy document
#
# Publishes one policy document, such as a privacy policy or terms of
# service, in `/.well-known/matrix/support` (the
# `org.matrix.msc4266.policies` field of MSC4266). These are informational;
# to make new users accept documents at sign-up, use
# `[global.registration_terms.<ID>]`.
#
# - `<ID>`: the policy id published to clients, such as `privacy_policy`.
#   The id is not validated (the spec allows `0-9 a-z A-Z . _ ~ -`). Bare
#   keys may use `A-Z a-z 0-9 _ -`; anything else must be quoted
#   (`[global.well_known.support_policy."privacy.v2"]`), and an unquoted
#   dot splits the name into nested tables.
#
# `version` and a
# `[global.well_known.support_policy.<ID>.policy_translation.<LANG>]`
# table are required; a policy table without them fails to load. Give
# it at least one language.
#
# Minimal example:
#
#     [global.well_known.support_policy.privacy_policy]
#     version = "1.0"
#
#     [global.well_known.support_policy.privacy_policy.policy_translation.en]
#     name = "Privacy Policy"
#     url = "https://example.com/privacy"
#
# Tips:
# - The translation table is `policy_translation` here but `translations`
#   under `[global.registration_terms.<ID>]`.
#
#[global.well_known.support_policy.<ID>]

# Version string of the policy document.
#
# example: "v6.7"
# reloadable: yes
#
#version =


################################################################################
# Support policy translation
#
# One language version of a `[global.well_known.support_policy.<ID>]`
# document: the title and link clients show for that language. Add one
# table per language; `name` and `url` are both required.
#
# - `<ID>`: the `<ID>` of the policy table this translation belongs to,
#   spelled (and quoted) the same way.
# - `<LANG>`: the language code, such as `en`, `fr` or `en-US` (RFC 5646;
#   some clients use `en_US`). It is published as the key for this
#   translation next to the policy's `version`, so it must not be
#   `version`; it is not validated otherwise. Bare keys may use
#   `A-Z a-z 0-9 _ -`; anything else must be quoted, and an unquoted dot
#   splits the name into nested tables.
#
# Example:
#
#     [global.well_known.support_policy.privacy_policy.policy_translation.de]
#     name = "Datenschutzrichtlinie"
#     url = "https://example.com/privacy-de"
#
#[global.well_known.support_policy.<ID>.policy_translation.<LANG>]

# User friendly name of the policy document.
#
# example: "Privacy Policy"
# reloadable: yes
#
#name =

# Link to the test of the policy document. A valid URL must be specified.
#
# example: "https://website.local/privacy-policy"
# reloadable: yes
#
#url =
