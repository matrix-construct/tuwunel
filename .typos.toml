[default]
# "mis-seeded" and similar: typos splits on the hyphen and flags the "mis" prefix.
# "STUNner" (a TURN server): typos splits on the case change and flags "Nner".
extend-ignore-re = ["mis-[a-z]+", "STUNner"]

[default.extend-words]
"HELO" = "HELO"
"allocatedp" = "allocatedp"
"conduwuit" = "conduwuit"
"execuse" = "execuse"
"leafs" = "leafs"
"serialize" = "serialize"
"consts" = "consts"
"fpr" = "fpr"
